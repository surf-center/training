<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Health</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Health">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f8;--surface:#fff;--surface2:#f1f3f7;--border:#e3e6ec;
  --text:#0f172a;--text2:#334155;--muted:#64748b;--muted2:#94a3b8;
  --accent:#2563eb;--accent-soft:#dbeafe;--good:#059669;--good-soft:#d1fae5;--warn:#d97706;--bad:#dc2626;
  --cell:#e8ebf0;--cell-done:#2563eb;--cell-today:#0f172a;
  --font:'Poppins',system-ui,-apple-system,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0b0f17;--surface:#131a26;--surface2:#1a2332;--border:#253044;
  --text:#e8edf5;--text2:#c3ccda;--muted:#8a96a8;--muted2:#5d6a7d;
  --accent:#60a5fa;--accent-soft:#1e3a5f;--good:#34d399;--good-soft:#064e3b;
  --cell:#1f2a3b;--cell-done:#60a5fa;--cell-today:#e8edf5;
}
:root[data-theme="dark"] .card{box-shadow:none;border:1px solid var(--border)}
:root[data-theme="dark"]{color-scheme:dark}
.themebtn{border:none;background:var(--surface);color:var(--text2);width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.06);flex:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{accent-color:#2563eb;color-scheme:light}
::selection{background:var(--accent-soft);color:var(--text)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 16px calc(60px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.3px}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted2)}
.dot.ok{background:var(--good)}.dot.busy{background:var(--warn)}.dot.err{background:var(--bad)}
.hdr-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.period{display:flex;gap:6px}
.period select{width:auto;font-size:12px;font-weight:600;padding:7px 8px;border-radius:10px;background:var(--surface);cursor:pointer}
.iconbtn{border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.label{flex-wrap:wrap;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.edit{font-size:11px;font-weight:600;color:var(--accent);background:none;border:none;cursor:pointer;padding:0;text-transform:none;letter-spacing:0;font-family:var(--font)}
.stack{position:relative;margin-bottom:34px;cursor:pointer}
.stack .scard{margin:0;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
.stack .scard+.scard{margin-top:12px}
.stack[aria-expanded="false"] .scard:nth-child(2),.stack[aria-expanded="false"] .scard:nth-child(3),.stack[aria-expanded="false"] .scard:nth-child(4){position:absolute;left:0;right:0;top:0;height:100%;margin:0;overflow:hidden;pointer-events:none}
.stack[aria-expanded="false"] .scard:nth-child(2){transform:translateY(12px) scale(.95);z-index:1;opacity:.85}
.stack[aria-expanded="false"] .scard:nth-child(3){transform:translateY(23px) scale(.9);z-index:0;opacity:.6}
.stack[aria-expanded="false"] .scard:nth-child(4){transform:translateY(23px) scale(.9);z-index:0;opacity:0}
.stack[aria-expanded="false"] .scard:nth-child(n+5){position:absolute;left:0;right:0;top:0;height:100%;opacity:0;pointer-events:none;overflow:hidden}
.stack[aria-expanded="false"] .scard:nth-child(2)>*,.stack[aria-expanded="false"] .scard:nth-child(3)>*,.stack[aria-expanded="false"] .scard:nth-child(4)>*{visibility:hidden}
.stack .scard:first-child{position:relative;z-index:2}
.stack[aria-expanded="true"]{margin-bottom:16px}
.more-n{margin-left:auto;margin-right:10px;font-size:11px;font-weight:800;color:var(--muted);background:var(--surface2);border-radius:20px;padding:2px 8px;letter-spacing:0}
.stack[aria-expanded="true"] .more-n{display:none}
.stack-less{display:none;margin:10px auto 0;border:none;background:none;font-family:var(--font);font-size:12px;font-weight:800;color:var(--muted);cursor:pointer}
.stack[aria-expanded="true"] .stack-less{display:block}
.wform{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:8px;margin-top:16px}
.wform input{min-width:0;width:100%;box-sizing:border-box}
.wform input[type=date]{-webkit-appearance:none;appearance:none;text-align:left}
@media (max-width:560px){.wform{grid-template-columns:minmax(0,1fr) 96px}.wform button.primary{grid-column:1/-1}.wform input{font-size:15px;padding:0 12px}}
.wform input,.wform button{height:44px;margin:0;border-radius:12px}
.wform input{font-size:15px;font-weight:700;padding:0 12px}
.wform button.primary{padding:0 20px;font-size:14px}
.linkbtn{display:block;width:100%;margin-top:10px;border:none;background:none;font-family:var(--font);font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;padding:6px}
.wtable{margin-top:4px;max-height:280px;overflow:auto;border-radius:12px;background:var(--surface2)}
.wtable table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.wtable th{position:sticky;top:0;background:var(--surface2);text-align:left;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:9px 12px}
.wtable td{padding:9px 12px;border-top:1px solid var(--border);font-weight:600}
.wtable td.kg{font-size:18px;font-weight:900;letter-spacing:-.3px}
.wtable td.chg{font-size:15px;font-weight:800}
.wtable td.dt{font-size:12px;font-weight:600;color:var(--muted);text-align:right}
.wtable th:nth-child(3){text-align:right}
.wtable .up{color:var(--good)}.wtable .dn{color:var(--warn)}.wtable .nc{color:var(--muted)}
.wtable th:last-child,.wtable td:last-child{text-align:right;width:36px}
.wtable button{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;display:inline-flex;border-radius:8px}
.wtable button:hover{color:var(--bad);background:var(--surface)}
.grid3{display:grid;grid-template-columns:1.3fr .8fr 1.3fr;gap:16px;margin-bottom:16px}
.grid3 .card{margin:0}
.big{font-size:17px;font-weight:700;margin-top:8px;white-space:pre-wrap}
.text{font-size:13px;color:var(--text2);margin-top:8px;white-space:pre-wrap}
.empty{color:var(--muted2);font-style:italic;font-weight:400}
.countdown{font-size:28px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--muted)}
.step{display:inline-block;font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-right:6px}
input,textarea,select{font-family:var(--font);font-size:13px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:8px 10px;width:100%}
textarea{min-height:90px;resize:vertical}
button.primary{font-family:var(--font);font-size:13px;font-weight:600;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:8px 14px;cursor:pointer;white-space:nowrap}
button.ghost{font-family:var(--font);font-size:13px;font-weight:600;background:none;color:var(--muted);border:1px solid var(--border);border-radius:9px;padding:8px 14px;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:12px 0 4px}
.stat .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.chartwrap{position:relative;margin-top:10px;overflow:hidden}
.chartwrap svg{display:block;max-width:100%}
svg text{font-family:var(--font)}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);font-size:11px;font-weight:600;padding:5px 8px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-120%);display:none}
.wlist{margin-top:12px;max-height:150px;overflow:auto;font-size:12px;border-top:1px solid var(--border)}
.wlist div{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px solid var(--border);color:var(--text2)}
.wlist button{background:none;border:none;color:var(--muted2);cursor:pointer;font-size:13px}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.navbar{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0}
.navbar button{border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:8px;width:28px;height:28px;cursor:pointer}
.navbar b{font-size:13px;color:var(--text);text-align:center;font-weight:700}
/* this week */
.week{display:grid;grid-template-columns:repeat(7,minmax(32px,1fr)) 56px;gap:6px;align-items:center;margin-top:14px}
.week .hd{font-size:10px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.4px;line-height:1.25}
.week .hd small{display:block;font-weight:500;font-size:10px;text-transform:none;letter-spacing:0;color:var(--muted2)}
.week .hd.today{color:var(--accent)}.week .hd.today small{color:var(--accent)}
.week .tot{font-size:12px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.chk{height:40px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:transparent;transition:background .12s,border-color .12s}
.chk:hover{border-color:var(--cell-done)}
.chk.on{background:var(--cell-done);border-color:var(--cell-done);color:#fff}
.chk.today{border-color:var(--text)}
.chk.on.today{border-color:var(--cell-done);box-shadow:0 0 0 2px var(--text)}
.chk.fut{opacity:.55}
.action{margin-top:16px}
.ahead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ahead .name{font-weight:700;font-size:14px}
.ahead .meta{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ahead .meta b{color:var(--text)}
.heat{margin-top:6px}
.more{display:block;margin:14px auto 0;font-size:12px;padding:6px 14px}
.mhead{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 10px}
.mhead button{border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:8px;width:30px;height:30px;cursor:pointer}
.mhead b{font-size:15px;min-width:140px;text-align:center}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:560px;margin:0 auto}
.month .dn{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.4px}
.month .day{aspect-ratio:1/1;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;font-family:var(--font);font-size:14px;font-weight:600;color:var(--text2);display:flex;align-items:center;justify-content:center;padding:0}
.month .day.on{background:var(--cell-done);border-color:var(--cell-done);color:#fff}
.month .day.today{border-color:var(--text)}
.month .day.fut{opacity:.55}
.month .blank{visibility:hidden}
.month .msum{grid-column:1/-1;text-align:center;font-size:13px;color:var(--muted);margin-top:4px}
.month .msum b{color:var(--text)}
.calsum{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-size:13px;color:var(--muted)}
.calsum b{font-size:22px;font-weight:800;color:var(--text);margin-right:2px}
.track.thin{height:4px;border:none;margin-top:8px}
.zoom{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.zoom span{min-width:52px;text-align:right}
.zoom input{width:90px;padding:0;background:none;border:none;accent-color:#2563eb;box-shadow:none}
.cal-title{font-size:13px;color:var(--text);letter-spacing:.4px}
.action .ahead .meta{font-size:13px}
.score{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:center;margin-top:14px;padding:16px 18px;border-radius:14px;background:var(--accent-soft)}
.score .pts{font-size:34px;font-weight:800;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.score .pts small{display:block;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-top:6px}
.score .lvl{font-size:15px;font-weight:800}
.score .lvl span{font-size:12px;font-weight:600;color:var(--muted);margin-left:6px}
.score .track{margin-top:6px;background:var(--surface)}
.score .how{grid-column:1/-1;font-size:11px;color:var(--muted)}
.score .wk{font-size:12px;color:var(--text2);margin-top:6px}
.score .wk b{color:var(--accent)}
.heat svg{display:block;width:100%;height:auto}
.tot.hit{color:var(--cell-done)}
.heat svg rect.c{cursor:pointer;transition:opacity .1s}
.heat svg rect.c:hover{opacity:.7}
/* process timeline */
.process{padding:22px 20px 18px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);position:relative;margin-top:16px}
.steps::before{content:"";position:absolute;left:12.5%;right:12.5%;top:17px;height:3px;background:var(--border);border-radius:2px}
.steps .fill{position:absolute;left:12.5%;top:17px;height:3px;background:var(--accent);border-radius:2px;transition:width .3s}
.st{position:relative;text-align:center;padding:0 6px;cursor:pointer}
.st .n{width:37px;height:37px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:var(--surface);border:3px solid var(--border);color:var(--muted);position:relative;z-index:1}
.st.ok .n{background:var(--accent);border-color:var(--accent);color:#fff}
.st.now .n{border-color:var(--text);color:var(--text)}
.st .t{font-weight:700;font-size:13px;margin-top:8px}
.st .v{font-size:12px;color:var(--text2);margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;padding-top:16px;border-top:1px dashed var(--border)}
.bar .top{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
.bar .top b{color:var(--text);font-size:12px}
.track{height:10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;border-radius:6px;transition:width .3s}
.bar .ends{display:flex;justify-content:space-between;font-size:10px;color:var(--muted2);margin-top:4px}
@media (max-width:560px){
  .steps{grid-template-columns:repeat(4,1fr)}
  .st .v{display:none}
  .st .t{font-size:11px}
  .bars{grid-template-columns:1fr}
}
dialog{border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--text);padding:22px;max-width:440px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(15,23,42,.45)}
dialog h3{margin:0 0 6px;font-size:16px}
dialog p{font-size:12px;color:var(--muted);margin:0 0 14px}
dialog label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin:10px 0 4px}
@media (max-width:820px){.grid3{grid-template-columns:1fr}}
@media (max-width:600px){.period select{font-size:16px}.period{flex:1;min-width:0}.period select{min-width:0}.period #selWeek{flex:1}}
@media (max-width:560px){
  .week{grid-template-columns:repeat(7,1fr) 40px;gap:4px}
  .chk{height:36px}
}
/* ===== action views + hand-drawn crosses ===== */
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;text-transform:none;letter-spacing:0}
.seg button{border:none;background:none;font-family:var(--font);font-size:12px;font-weight:800;color:var(--muted);padding:6px 12px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(15,23,42,.12)}
#actionCard .view{display:none}
#actionCard[data-view="week"] #week,#actionCard[data-view="month"] #monthView,#actionCard[data-view="year"] #yearView{display:block}
.chk,.month .day{position:relative;overflow:visible}
.chk.on,.month .day.on{background:var(--surface2);border-color:var(--border);color:var(--text2)}
.chk.on.today,.month .day.on.today{border-color:var(--text);box-shadow:none}
.xm{position:absolute;left:-14%;top:-14%;width:128%;height:128%;pointer-events:none;overflow:visible;z-index:2}
.xm path{fill:none;stroke:var(--text);stroke-width:16;stroke-linecap:round;stroke-linejoin:round}
.xm.new path{stroke-dasharray:110;stroke-dashoffset:110;animation:draw .18s ease-out forwards}
.xm.new path+path{animation-delay:.14s}
.xm.ck path{stroke:var(--accent)}
.dgrid.wk.tw .xm path{stroke:var(--accent)} /* Training Today: the whole week in blue */
.cday.today.on{border-color:transparent}
@keyframes draw{to{stroke-dashoffset:0}}
.heat svg .yx{fill:none;stroke:var(--text);stroke-width:3.4;stroke-linecap:round;pointer-events:none}
button.big{font-size:13px;padding:9px 18px;margin-left:auto;line-height:inherit}
/* ===== round days ===== */
.month{margin-top:16px}
.dgrid,.month{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;max-width:520px;margin:0 auto}
.dc{display:flex;justify-content:center;align-items:center;min-width:0}
.cday{position:relative;overflow:visible;width:100%;max-width:46px;aspect-ratio:1/1;border-radius:50%;border:2px solid var(--border);background:var(--surface2);cursor:pointer;padding:0;font-family:var(--font);font-size:14px;font-weight:800;color:var(--text2);display:flex;align-items:center;justify-content:center}
.cday.today{border-color:var(--text)}
.cday.fut{opacity:.5}
.cday:hover{border-color:var(--text)}
.msum{grid-column:1/-1;text-align:center;font-size:14px;color:var(--muted);font-weight:600;margin-top:14px}
.msum b{color:var(--text);font-weight:900}
.mhead{margin:14px 0 12px}
.ygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 16px;margin-top:14px}
.ym{min-width:0}
.ymh{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:6px}
.ymh b{font-weight:800}.ymh span{font-weight:800;color:var(--accent)}
.ymg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.yd{position:relative;overflow:visible;aspect-ratio:1/1;border-radius:50%;border:none;background:var(--cell);padding:0;cursor:pointer}
.yd.today{box-shadow:0 0 0 1.5px var(--text)}
.yd.fut{opacity:.45}
.yd .xm path{stroke-width:18}
/* year view: trained days are just a loose hand-drawn cross (blue only for today), no filled dot behind it */
.yd.on{background:transparent}.yd.today.on{box-shadow:none}
@media (max-width:700px){.ygrid{grid-template-columns:repeat(3,1fr);gap:14px 12px}}
/* ===== bold & clean ===== */
.ttl .step{font-size:11px;vertical-align:2px;margin-right:7px}
.calicon{width:21px;height:21px;margin-right:8px;vertical-align:-4px;fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ttl{font-family:var(--font);font-size:17px;font-weight:800;text-transform:none;letter-spacing:-.3px;color:var(--text)}
body{font-size:15px}
h1{font-size:30px;font-weight:900;letter-spacing:-.6px}
.card{border:none;border-radius:22px;padding:22px 22px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06)}
.label{font-size:12px;font-weight:800;letter-spacing:.8px;color:var(--text)}
.step{font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;background:var(--accent);color:#fff}
.edit{font-size:12px;font-weight:700}
.countdown{font-size:38px;font-weight:900;letter-spacing:-1px;margin-top:8px}
.sub{font-size:13px;font-weight:500}
.steps::before,.steps .fill{top:21px;height:5px;border-radius:3px}
.st .n{width:46px;height:46px;font-size:16px;font-weight:900;border-width:4px}
.st .t{font-size:14px;font-weight:800;margin-top:10px}
.st .v{font-size:13px;font-weight:600}
.bars{gap:24px;margin-top:22px;padding-top:18px}
.bar .top{font-size:13px;font-weight:700;color:var(--text2)}
.bar .top b{font-size:15px;font-weight:700;letter-spacing:0;color:var(--text2)}
.track{height:14px;border:none;border-radius:8px}
.track i{border-radius:8px}
.bar .ends{font-size:11px;font-weight:600}
.week{gap:8px}
.week .hd{font-size:11px;font-weight:800}
.week .tot{font-size:16px;font-weight:900}
.chk{height:auto;aspect-ratio:1/1;max-height:56px;border-radius:14px;border-width:2px}
.calsum{font-size:14px;font-weight:600}
.calsum b{font-size:34px;font-weight:900;letter-spacing:-1px}
#actSum .track{margin-bottom:22px}
.dgrid.wk{margin-top:30px;margin-bottom:8px;gap:10px}
.track.thin{height:8px}
.stat .v{font-size:32px;font-weight:900;letter-spacing:-.8px}
.stat .l{font-size:11px;font-weight:800}
.stats{gap:36px}
.month .day{font-size:15px;font-weight:800;border-radius:14px}
button.primary{font-weight:800;border-radius:11px;padding:10px 18px;background:#2563eb;color:#fff}
button.ghost{font-weight:700;border-radius:11px}
.period{background:var(--surface);border-radius:12px;padding:3px;box-shadow:0 1px 2px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.06);gap:0;align-items:center}
.period select{border:none;background:transparent;box-shadow:none;font-weight:800;font-size:13px;padding:7px 10px;border-radius:9px;-webkit-appearance:none;appearance:none;color:var(--text)}
.period select:focus{box-shadow:none;background:var(--surface2)}
.period select+select{border-left:1px solid var(--border);border-radius:0 9px 9px 0}
.iconbtn{border-radius:11px}
@media (max-width:560px){.countdown{font-size:32px}.stat .v{font-size:28px}.chk{border-radius:12px}.st .n{width:40px;height:40px}.steps::before,.steps .fill{top:18px}}
/* ===== intro ===== */
#intro{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .45s ease}
#intro.out{opacity:0;pointer-events:none}
#intro[hidden]{display:none}
.in-stage{position:relative;width:100%;max-width:460px}
.in-slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;transform:translateY(18px) scale(.98);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
.in-slide.on{opacity:1;transform:none;transition-delay:.2s}
.in-slide.off{opacity:0;transform:translateY(-18px) scale(.98);transition:opacity .16s ease,transform .2s ease}
.in-step{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent)}
.in-big{font-size:64px;font-weight:900;letter-spacing:-2px;line-height:1.05;margin-top:10px;color:var(--text)}
.in-sub{font-size:15px;font-weight:600;color:var(--muted);margin-top:10px}
.in-cross{width:120px;height:120px;margin-top:8px;position:relative}
.in-cross .ring{position:absolute;inset:14px;border-radius:50%;border:4px solid var(--border);background:var(--surface2)}
.in-cross svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.in-cross path{fill:none;stroke:var(--accent);stroke-width:13;stroke-linecap:round;stroke-dasharray:110;stroke-dashoffset:110}
.in-slide.on .in-cross path{animation:draw .28s ease-out .35s forwards}
.in-slide.on .in-cross path+path{animation-delay:.6s}
.in-eq{display:flex;flex-direction:column;gap:22px;padding:0 24px}
.in-row{text-align:center}
.in-term,.in-res{opacity:0;transform:translateY(12px);transition:opacity .4s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
.in-term.on,.in-res.on{opacity:1;transform:none}
.in-term{font-size:30px;font-weight:900;letter-spacing:-.8px;color:var(--text);line-height:1.15}
.in-res{font-size:18px;font-weight:800;color:var(--accent);margin-top:4px;letter-spacing:-.2px}
.in-row.last .in-res{font-size:40px;font-weight:900;letter-spacing:-1.2px;margin-top:8px}
.in-eq .op{color:var(--muted2);font-weight:800}
.in-x{display:inline-block;width:.9em;height:.9em;vertical-align:-.08em;margin-left:.15em}
.in-x svg{width:100%;height:100%;overflow:visible}
.in-x path{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round;stroke-dasharray:110;stroke-dashoffset:110}
.in-term.on .in-x path{animation:draw .25s ease-out .25s forwards}
.in-term.on .in-x path+path{animation-delay:.48s}
@media (max-width:420px){.in-term{font-size:26px}.in-row.last .in-res{font-size:34px}}
.in-dots{display:flex;gap:8px;margin-top:22px}
.in-dots i{width:8px;height:8px;border-radius:50%;background:var(--border);transition:background .3s,width .3s}
.in-dots i.on{background:var(--accent);width:22px;border-radius:5px}
.in-skip{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));border:none;background:none;font-family:var(--font);font-size:13px;font-weight:800;color:var(--muted);cursor:pointer}
/* ===== intro v2: dark, tight, motivating ===== */
#intro{background:radial-gradient(120% 80% at 20% 0%,#1e3a8a 0%,#0b1220 55%,#05080f 100%);color:#fff;align-items:stretch}
#intro .in-stage{max-width:420px;margin:0 auto;padding:0 32px;width:100%}
#intro .in-eq{gap:0;padding:0;align-items:flex-start}
#intro .in-row{text-align:left;display:flex;align-items:baseline;justify-content:space-between;gap:12px;width:100%;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08)}
#intro .in-term{font-size:27px;font-weight:900;letter-spacing:-.8px;color:#fff;line-height:1.1}
#intro .in-term i{font-style:normal;color:#60a5fa;margin:0 .1em}
#intro .in-tag{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#93c5fd;border:1px solid rgba(147,197,253,.35);border-radius:20px;padding:4px 10px;white-space:nowrap;opacity:0;transform:translateX(10px);transition:opacity .35s,transform .45s cubic-bezier(.2,.8,.2,1)}
#intro .in-tag.on{opacity:1;transform:none}
#intro .in-x path{stroke:#60a5fa}
#intro .in-final{display:flex;align-items:baseline;gap:12px;margin-top:22px;opacity:0;transform:translateY(16px) scale(.96);transform-origin:left;transition:opacity .45s,transform .6s cubic-bezier(.2,1.2,.3,1)}
#intro .in-final.on{opacity:1;transform:none}
#intro .in-final .eq{font-size:44px;font-weight:900;color:#60a5fa}
#intro .in-final .word{font-size:64px;font-weight:900;letter-spacing:-2.5px;line-height:1;background:linear-gradient(90deg,#fff 0%,#bfdbfe 60%,#60a5fa 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#intro .in-tagline{margin-top:14px;font-size:16px;font-weight:700;color:rgba(255,255,255,.7);opacity:0;transform:translateY(8px);transition:opacity .4s,transform .5s}
#intro .in-tagline.on{opacity:1;transform:none}
#intro .in-bar{position:absolute;top:calc(14px + env(safe-area-inset-top));left:24px;right:24px;height:3px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
#intro .in-bar i{display:block;height:100%;width:0;background:#60a5fa;border-radius:3px}
#intro .in-skip{top:calc(28px + env(safe-area-inset-top));bottom:auto;right:20px;color:rgba(255,255,255,.6)}
@media (max-width:420px){#intro .in-term{font-size:23px}#intro .in-final .word{font-size:54px}#intro .in-final .eq{font-size:38px}}
/* ===== laptop layout ===== */
@media (min-width:1000px){
  .wrap{max-width:1180px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:stretch;padding-top:40px}
  .wrap>header{grid-column:1/-1;margin-bottom:0}
  .wrap>#todayCard{grid-column:1;grid-row:2;align-self:start}
  .wrap>#actionCard{grid-column:1;grid-row:3;align-self:start}
  #actionCard>.label{display:none}
  .wrap>.stack{grid-column:2;grid-row:2/5;align-content:start}
  .wrap>#overCard{grid-column:1/-1;grid-row:2;max-width:720px;width:100%;justify-self:center}

  .wrap>.card{margin:0}
  .stack,.stack[aria-expanded]{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;margin:0;cursor:default}
  .stack .scard,.stack[aria-expanded] .scard:nth-child(n){position:relative!important;transform:none!important;opacity:1!important;height:auto!important;margin:0!important;pointer-events:auto!important;z-index:auto!important}
  .stack[aria-expanded] .scard:nth-child(n)>*{visibility:visible!important}
  .stack .more-n,.stack .stack-less{display:none!important}
  h1{font-size:34px}
  .card{padding:26px 28px}
  #actionCard .cday{max-width:52px;font-size:15px}
  .ygrid{grid-template-columns:repeat(3,1fr)}
}
/* ===== intro v6: calm formula board ===== */
.k6-top{display:none!important;position:absolute;top:0;left:28px;right:28px;display:flex;flex-wrap:wrap;gap:6px 0;font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#fff}
.k6-top span{opacity:0;transform:translateY(6px);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1);margin-right:8px}
.k6-top span.on{opacity:1;transform:none}
.k6-top i{font-style:normal;color:#60a5fa;margin-right:8px}
.k6{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:0 28px;transition:opacity .45s ease,transform .6s cubic-bezier(.6,0,.4,1)}
.k6.out{opacity:0;transform:translateY(-30px)}
.k6-row{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .8s cubic-bezier(.16,1,.3,1),max-height .45s ease,margin .45s ease;max-height:160px}
.k6-row.in{opacity:1;transform:none}
.k6-row.past{opacity:1}
.k6-row.gone{opacity:0;max-height:0;margin-top:-22px;overflow:hidden}
.k6-t{font-size:min(30px,6.6vw);font-weight:900;letter-spacing:-.03em;line-height:1.05;color:#fff;text-transform:uppercase}
.k6-t i,.k6-o i{font-style:normal;color:#fff}
/* blue marker line that sweeps in under 'consistency in action' (works across wrapped lines) */

  background:none}

  background:rgba(255,255,255,.58);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);

.checks{display:grid;gap:16px;margin-top:14px}

.fc svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}.fc svg .eye{fill:currentColor;stroke:none}

body.ov #actionCard,body.ov #todayCard,body.ov .stack,body.ov #progCard{display:none!important}

.calhead{display:flex;gap:8px;align-items:center;margin:16px 0 4px}#actionCard .period select{border-radius:9px!important}.calhead .seg{flex:none}.calhead .seg button{padding:7px 9px;font-size:12px}

<script>
// ---------- Storage: Google Sheet (Apps Script) or local ----------
const LS_AUTH='training.auth';
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
// Multi-user: names + passwords live in the sheet's Users tab. A device logs in once and keeps
// only {name, token}; each user sees just their own rows.
const API_URL='https://script.google.com/macros/s/AKfycbzZZcqDX0pMBG9Lu0TsbTM_HTidZblEwPNMPAlrH_S0ekKSBVOZ8qQoqcRpSbC2CfRn/exec';
let auth=ls.get(LS_AUTH,null);
const LS_DATA=()=>'training.data.'+(auth?auth.name.toLowerCase():'');
let S={settings:{},weight:[],actions:[],modules:['training']};
const remote=()=>!!(auth&&auth.token);
const setData=j=>{S={settings:j.settings||{},weight:j.weight||[],actions:j.actions||[],modules:j.modules||['training']};ls.set(LS_DATA(),S);};
function showWho(){const w=$('who');w.textContent=auth?auth.name:'Log in';w.classList.toggle('out',!auth);}
function logout(){auth=null;try{localStorage.removeItem(LS_AUTH)}catch(e){}S={settings:{},weight:[],actions:[]};showWho();render();}

function setSync(state,text){document.getElementById('dot').className='dot '+(state||'');document.getElementById('syncText').textContent=text;}

async function load(){
  showWho();
  if(!remote()){setSync('','Not logged in');render();setTimeout(askLogin,300);return;}
  S=ls.get(LS_DATA(),S);render();setSync('busy','Loading…');
  try{
    const r=await fetch(API_URL+'?name='+encodeURIComponent(auth.name)+'&token='+encodeURIComponent(auth.token));
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'Error');
    setData(j);setSync('ok','Connected to Google');
  }catch(e){setSync('err','Sheet unreachable: '+e.message);if(/log in/i.test(e.message)){logout();setTimeout(askLogin,300);}}
  render();
}

// Optimistic: update locally first, then write to the sheet.
async function save(payload){
  if(!remote()){render();askLogin();return;}
  ls.set(LS_DATA(),S);render();
  setSync('busy','Saving…');
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,name:auth.name,token:auth.token})});
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'Error');
    setData(j);setSync('ok','Saved to Google');render();
  }catch(e){setSync('err','Not saved: '+e.message);}
}
function saveSettings(obj){Object.assign(S.settings,obj);save({type:'settings',settings:obj});}

// ---------- helpers ----------
const LOC='en-GB';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d);};
const todayIso=iso(new Date());
const fmtD=s=>parse(s).toLocaleDateString(LOC,{day:'numeric',month:'short',year:'numeric'});
const fmtDs=s=>parse(s).toLocaleDateString(LOC,{day:'numeric',month:'short'});
const fmtKg=v=>(Math.round(v*10)/10).toLocaleString(LOC,{minimumFractionDigits:1,maximumFractionDigits:1});
// Modules (switched on per person in the sheet's Users tab). A day counts as done when all its items are ticked.
const MODS={
  training:{label:'Training',title:'Training',groups:[{items:['Training']}],plan:'daysPerWeek',def:0,
    icon:'<rect x="4.4" y="5" width="4" height="14" rx="1.5"/><rect x="15.6" y="5" width="4" height="14" rx="1.5"/><path d="M8.4 12h7.2M2 9.3v5.4M22 9.3v5.4"/>'},
  food:{label:'Nutrition',title:'Nutrition',plan:'foodPerWeek',def:6,target:'foodTarget',tdef:85,
    water:{max:8,goal:5,ml:500},
    groups:[{label:'Meals',items:['Breakfast','Lunch','Dinner'],cols:3},{label:'Bonus',items:['Creatine','Protein','Evening','Snack'],cols:4,bonus:true}],
    goal:'Fuel the gains',note:'2.5 L water, breakfast, lunch and dinner every day.\nBonus: creatine, protein, an evening meal or a snack.',
    icon:'<path d="M7 3v18M4.5 3v5.5a2.5 2.5 0 0 0 5 0V3M17.5 21V3c-2.2 1.2-3.5 4-3.5 7.5V13h3.5"/>'},
  sleep:{label:'Sleep',title:'Sleep',plan:'sleepPerWeek',def:5,target:'sleepTarget',tdef:75,
    groups:[],rating:true, // one rating per night: Sleep:1..5 = 20..100
    goal:'Wake up rested',note:'In bed by 23:00 and 7+ hours of sleep.\nRate every night, aim for Good or Great.',
    icon:'<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/>'},
};
Object.values(MODS).forEach(M=>{M.items=M.groups.flatMap(g=>g.items);M.base=M.groups.filter(g=>!g.bonus).flatMap(g=>g.items);M.bonus=M.groups.filter(g=>g.bonus).flatMap(g=>g.items);});
const ITEM_LBL={Training:'Trained today'};
const ITEM_HINT={};
const userMods=()=>{const m=(S.modules||['training']).filter(x=>MODS[x]);return m.length?m:['training'];};
let mod=(()=>{try{return localStorage.getItem('training.mod')||'training'}catch(e){return 'training'}})();
const perWeek=()=>{const M=MODS[mod],n=parseInt(S.settings[M.plan],10);return n>=1&&n<=7?n:M.def;};
const has=(d,a)=>S.actions.some(x=>x.date===d&&x.action===a);
const RATE=[{l:'Bad',m:'M8 16.6c1.1-1.5 2.4-2.2 4-2.2s2.9.7 4 2.2'},{l:'Poor',m:'M8.6 16c.9-.7 2.1-1.1 3.4-1.1s2.5.4 3.4 1.1'},{l:'OK',m:'M8.6 15.2h6.8'},{l:'Good',m:'M8.6 14.4c.9.8 2.1 1.2 3.4 1.2s2.5-.4 3.4-1.2'},{l:'Great',m:'M7.9 13.7c1.1 1.8 2.5 2.8 4.1 2.8s3-1 4.1-2.8'}];
const rateOf=d=>{const a=S.actions.find(x=>x.date===d&&/^Sleep:[1-5]$/.test(x.action));return a?+a.action.slice(6):0;};
const face=i=>`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><circle cx="9" cy="10" r="1.1" class="eye"/><circle cx="15" cy="10" r="1.1" class="eye"/><path d="${RATE[i].m}"/></svg>`;
// rate a night: tap the same face again to clear it
function setRating(d,n){const cur=rateOf(d),set={};lastToggled=d;setTimeout(()=>{lastToggled=null;},600);
  for(let k=1;k<=5;k++){const on=k===n&&n!==cur,was=k===cur;if(on!==was)set['Sleep:'+k]=on;}
  S.actions=S.actions.filter(x=>!(x.date===d&&/^Sleep:[1-5]$/.test(x.action)));
  if(n!==cur)S.actions.push({date:d,action:'Sleep:'+n});
  save({type:'batch',date:d,set});}
const waterN=d=>S.actions.filter(a=>a.date===d&&/^Water:\d$/.test(a.action)).length;
// a day is done when every tick is set (and, for Food, the water goal is reached)
const trained=()=>{const M=MODS[mod],by={};
  if(M.rating)return new Set(S.actions.filter(a=>/^Sleep:[45]$/.test(a.action)).map(a=>a.date));
  S.actions.forEach(a=>{if(M.base.includes(a.action))(by[a.date]=by[a.date]||new Set()).add(a.action);});
  if(M.water){const ds=new Set(S.actions.filter(a=>a.action.startsWith('Water:')||M.items.includes(a.action)).map(a=>a.date));return new Set([...ds].filter(d=>dayVal(mod,d)>=100));}
  return new Set(Object.keys(by).filter(d=>by[d].size===M.base.length));};
const mondayOf=d=>{const m=new Date(d.getFullYear(),d.getMonth(),d.getDate());m.setDate(m.getDate()-((m.getDay()+6)%7));return m;};
const isoWeek=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7);};
// Goal start: progress (time, weight, plan line) is measured from the day the goal was set.
const goalStart=()=>S.settings.goalStart||todayIso;
const actStart=()=>{if(mod==='training')return goalStart();const ds=S.actions.filter(a=>MODS[mod].items.includes(a.action)||(MODS[mod].water&&/^Water:/.test(a.action))||(MODS[mod].rating&&/^Sleep:[1-5]$/.test(a.action))).map(a=>a.date).sort();return ds[0]&&ds[0]<todayIso?ds[0]:todayIso;};
function startWeight(W){ // last measurement before the goal start day, else the first one on/after it
  if(!W.length)return null;
  const before=W.filter(w=>w.date<goalStart());
  return before.length?before[before.length-1]:W[0];
}
// Trend: linear fit over the last 6 weeks of measurements (at least 3 points).
function trend(W){
  if(W.length<2)return null;
  const lastT=parse(W[W.length-1].date).getTime();
  let P=W.filter(w=>lastT-parse(w.date).getTime()<=42*864e5);
  if(P.length<3)P=W.slice(-Math.min(W.length,5));
  if(P.length<2)return null;
  const xs=P.map(w=>(parse(w.date).getTime()-lastT)/864e5),ys=P.map(w=>w.kg);
  const n=xs.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;
  let sxx=0,sxy=0;xs.forEach((x,i)=>{sxx+=(x-mx)**2;sxy+=(x-mx)*(ys[i]-my);});
  if(!sxx)return null;
  const slope=sxy/sxx,b=my-slope*mx; // kg per day, value at last measurement date = b
  return {slope,lastT,at:t=>b+slope*(t-lastT)/864e5,days:Math.round(-Math.min(...xs)),n};
}
let year=new Date().getFullYear();
let weekStart=mondayOf(new Date());
let monthStart=new Date(new Date().getFullYear(),new Date().getMonth(),1);

// A hand-drawn looking cross, slightly different per day (seeded by the date), larger than its box.
function hashStr(k){let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))|0;return h;}
// blue=true: today's cross, drawn in blue (earlier days stay black)
function crossSVG(k,blue){
  const h=hashStr(k),j=n=>((h>>(n*3))&7)-3.5; // -3.5..3.5
  const r=((h>>2)%9)-4;                          // rotation -4..4 deg
  return `<svg class="xm${blue?' ck':''}${k===lastToggled?' new':''}" viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(${r} 50 50)">`
    +`<path d="M${18+j(1)} ${20+j(2)} Q${50+j(3)} ${47+j(4)} ${82+j(5)} ${80+j(6)}"/>`
    +`<path d="M${81+j(7)} ${19+j(8)} Q${52+j(9)} ${51+j(1)} ${19+j(2)} ${83+j(3)}"/></g></svg>`;
}
let lastToggled=null;
function toggleItem(d,a){lastToggled=d;setTimeout(()=>{lastToggled=null;},600);
  const on=has(d,a);
  if(on)S.actions=S.actions.filter(x=>!(x.date===d&&x.action===a));else S.actions.push({date:d,action:a});
  save({type:'action',date:d,action:a,done:!on});
}
// tap on a calendar day: one-item modules toggle directly, Food opens that day's checklist
function toggle(d){const M=MODS[mod];if(M.items.length===1&&!M.water)return toggleItem(d,M.items[0]);openDay(d);}
// every tick in the checklists uses the same hand-drawn cross (the one the user liked on Dinner)
const CHK_X='2026-11-06Dinner';
// remembered open/closed sections (per device)
const UI=(()=>{try{return Object.assign({bonus:false,trend:false,details:false,hist:false},JSON.parse(localStorage.getItem('training.ui')||'{}'))}catch(e){return {bonus:false,trend:false}}})();
const saveUI=()=>{try{localStorage.setItem('training.ui',JSON.stringify(UI))}catch(e){}};
const pill=(d,a)=>{const on=has(d,a);return `<button type="button" class="pill${on?' on':''}" data-item="${a}" data-day="${d}"><span>${a}</span></button>`;};
const chk=(d,a)=>{if(mod==='food')return pill(d,a);const on=has(d,a);return `<button type="button" class="chk-i${on?' on':''}" data-item="${a}" data-day="${d}"><span>${ITEM_LBL[a]||a}${BONUS[a]&&mod==='food'?`<i class="bp">+${BONUS[a]}</i>`:''}${ITEM_HINT[a]?`<small class="hint">${ITEM_HINT[a]}</small>`:''}</span><span class="bx">${on?crossSVG(CHK_X,false):''}</span></button>`;};
// a 500 ml bottle; the cross is drawn on top once it's drunk
// a 500 ml shaker: lid + cup; once drunk the cup fills blue to ~60%
const BODY='M6.2 8.1h11.6v17.6a2.6 2.6 0 0 1-2.6 2.6H8.8a2.6 2.6 0 0 1-2.6-2.6z';
const bottle=(id,on)=>`<svg class="btl" viewBox="4.6 3.2 14.8 26.2" aria-hidden="true"><defs><clipPath id="${id}"><path d="${BODY}"/></clipPath></defs>${on?`<rect class="wtr" x="5" y="16" width="14" height="13" clip-path="url(#${id})"/>`:''}<path d="M6.2 4.1h11.6v4H6.2z"/><path d="${BODY}"/></svg>`;
const L=ml=>(ml/1000).toLocaleString(LOC,{minimumFractionDigits:1,maximumFractionDigits:1});
function checksHTML(d){const M=MODS[mod];let h='';
  if(M.rating){const r=rateOf(d);
    h+=`<div class="rate"><div class="faces">${RATE.map((x,i)=>`<button type="button" class="fc${r===i+1?' on':''}" data-rate="${i+1}" data-day="${d}" aria-label="${x.l}">${face(i)}<span>${x.l}</span></button>`).join('')}</div></div>`;}
  if(M.water){const W=M.water,n=waterN(d);
    h+=`<div class="water wrow"><svg class="wdrop" viewBox="0 0 24 24" aria-label="Water"><path d="M12 3.5c3 4 6.2 7.4 6.2 10.7a6.2 6.2 0 0 1-12.4 0C5.8 10.9 9 7.5 12 3.5z"/></svg>
      <div class="bottles">${[...Array(W.max)].map((_,i)=>`<button type="button" class="bt${i<n?' on':''}" data-water="${i+1}" data-day="${d}" aria-label="${(i+1)*W.ml} ml">${bottle('bw'+d+i,i<n)}</button>`).join('')}</div></div><div class="wamt">${L(n*W.ml)} <i>/ ${L(W.goal*W.ml)} L</i></div>`;}
  M.groups.forEach(g=>{
    if(g.bonus&&mod==='food'){h+=`<div class="cg-i c${g.cols} nolab">${g.items.map(a=>chk(d,a)).join('')}</div>`;return;}
    if(g.bonus){ // bonus folds away: the header shows what you earned, tap to open
      const open=UI.bonus,pts=bonusPts(mod,d);
      h+=`<div class="cgroup"><button type="button" class="cg-l cg-tog" data-tog="bonus">Bonus${pts?` · <b>+${pts}</b> today`:''}<span>${open?'Hide ▴':'Show ▾'}</span></button>${open?`<div class="cg-i c${g.cols}">${g.items.map(a=>chk(d,a)).join('')}</div>`:''}</div>`;return;}
    h+=`<div class="cgroup">${g.label&&mod!=='food'?`<div class="cg-l">${g.label}</div>`:''}<div class="cg-i${g.cols?' c'+g.cols:''}">${g.items.map(a=>chk(d,a)).join('')}</div></div>`;});
  return h;}
// ---------- scores (0-100): what you did vs what your plan asks, per module and in total ----------
// A day's value: Training 1 if trained; Food = share of ticks done (water counts as one, up to the goal); Sleep = share of ticks.
const WEIGHT={training:40,food:30,sleep:30};
// the basics make 100 (Food: water, breakfast, lunch, dinner); bonus actions add +5 each on top
function frac(m,d){const M=MODS[m];
  if(m==='training')return has(d,'Training')?1:0;
  if(M.rating)return rateOf(d)/5;
  let n=M.base.filter(a=>has(d,a)).length,t=M.base.length;
  if(M.water){n+=Math.min(waterN(d),M.water.goal)/M.water.goal;t+=1;}
  return n/t;}
// bonus on top of the basics: creatine +5, protein +5, evening meal +10, snack +5; at most +25 so a day tops out at 125
const BONUS={Creatine:5,Protein:5,Evening:10,Snack:5},BONUS_MAX=25;
// a day's points: basics plus bonus, never above 100
const dayVal=(m,d)=>Math.min(100,Math.round(frac(m,d)*100+bonusPts(m,d)));
const bonusPts=(m,d)=>Math.min(BONUS_MAX,MODS[m].bonus.filter(a=>has(d,a)).reduce((t,a)=>t+(BONUS[a]||5),0));
// average bonus per day over the period (only days since the start, up to today)
function modBonus(m,a,b){const st=startOf(m);if(!st||!MODS[m].bonus.length)return 0;const from=a>st?a:st,to=b<todayIso?b:todayIso;if(from>to)return 0;
  let s=0,n=0;for(let d=from;d<=to;d=addD(d,1)){s+=bonusPts(m,d);n++;}return Math.round(s/n);}

// Chart zoom: how far back the chart shows (0 = everything)
const ZOOMS=[['All',0],['1 year',365],['6 months',182],['3 months',91],['1 month',30]];
let zoomI=(()=>{try{const raw=localStorage.getItem('training.zoom');if(raw===null)return innerWidth<600?3:0;const v=+raw;return v>=0&&v<ZOOMS.length?v:0}catch(e){return innerWidth<600?3:0}})();
function drawChart(W,tw,dl){
  const wrap=$('chartWrap');wrap.querySelector('svg')?.remove();$('tip').style.display='none';
  if(!W.length)return;
  const width=Math.max(200,wrap.clientWidth),height=width<420?200:240,m={l:34,r:8,t:12,b:26};
  const tr=trend(W);
  const ref=Math.max(parse(W[W.length-1].date).getTime(),parse(todayIso).getTime());
  const t0=ZOOMS[zoomI][1]?Math.max(parse(W[0].date).getTime(),ref-ZOOMS[zoomI][1]*864e5):parse(W[0].date).getTime();
  // y-range follows what is visible (plus the point just before the window, for a continuous line)
  const firstVis=Math.max(0,W.findIndex(w=>parse(w.date).getTime()>=t0)-1);
  const Wv=W.slice(firstVis);
  let t1=Math.max(parse(W[W.length-1].date).getTime(),parse(todayIso).getTime());
  if(dl)t1=Math.max(t1,parse(dl).getTime());
  if(t1-t0<7*864e5)t1=t0+7*864e5;
  const tf=dl?parse(dl).getTime():null; // forecast runs to the deadline
  const vals=Wv.map(w=>w.kg);if(tw)vals.push(tw);if(tr&&tf)vals.push(tr.at(tf));
  let lo=Math.min(...vals),hi=Math.max(...vals);const padv=Math.max(1,(hi-lo)*.15);lo=Math.floor(lo-padv);hi=Math.ceil(hi+padv);
  const x=t=>m.l+(t-t0)/(t1-t0)*(width-m.l-m.r), y=v=>m.t+(hi-v)/(hi-lo)*(height-m.t-m.b);
  let s=`<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><defs><clipPath id="plotClip"><rect x="${m.l}" y="0" width="${width-m.l}" height="${height-m.b}"/></clipPath></defs>`;
  const step=Math.max(1,Math.ceil((hi-lo)/4));
  for(let v=Math.ceil(lo);v<=hi;v+=step){s+=`<line x1="${m.l}" x2="${width-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`;}
  const d=new Date(t0);d.setDate(1);d.setMonth(d.getMonth()+1);
  const months=[];while(d.getTime()<=t1){months.push(new Date(d));d.setMonth(d.getMonth()+1);}
  const every=Math.ceil(months.length/8)||1;
  months.forEach((md,i)=>{if(i%every)return;s+=`<text x="${x(md.getTime())}" y="${height-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${md.toLocaleDateString(LOC,{month:'short'})}${md.getMonth()===0?" '"+String(md.getFullYear()).slice(2):''}</text>`;});
  if(tw)s+=`<line x1="${m.l}" x2="${width-m.r}" y1="${y(tw)}" y2="${y(tw)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  const sw=startWeight(W),gs=parse(goalStart()).getTime();
  if(tw&&dl&&sw)s+=`<line x1="${x(Math.max(t0,gs))}" y1="${y(sw.kg)}" x2="${x(parse(dl).getTime())}" y2="${y(tw)}" stroke="var(--muted2)" stroke-width="1.5" stroke-dasharray="2 4"/>`;
  // forecast: trend line from the last measurement to the deadline
  if(tr&&tf&&tf>tr.lastT){const fx=x(tf),fy=y(tr.at(tf));
    s+=`<line x1="${x(tr.lastT)}" y1="${y(tr.at(tr.lastT))}" x2="${fx}" y2="${fy}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5" opacity=".55"/>`
     +`<circle cx="${fx}" cy="${fy}" r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2" stroke-dasharray="2 2"/>`
     +`<text x="${fx-8}" y="${fy+16}" text-anchor="end" font-size="10" font-weight="700" fill="var(--text)">${fmtKg(tr.at(tf))} kg forecast</text>`;}
  const tt=parse(todayIso).getTime();
  s+=`<line x1="${x(tt)}" x2="${x(tt)}" y1="${m.t}" y2="${height-m.b}" stroke="var(--muted2)" stroke-width="1"/><text x="${x(tt)+4}" y="${height-m.b-6}" font-size="10" font-weight="600" fill="var(--muted)">today</text>`;
  if(dl)s+=`<line x1="${x(parse(dl).getTime())}" x2="${x(parse(dl).getTime())}" y1="${m.t}" y2="${height-m.b}" stroke="var(--bad)" stroke-width="1" stroke-dasharray="3 3"/><text x="${x(parse(dl).getTime())-4}" y="${m.t+10}" text-anchor="end" font-size="10" font-weight="600" fill="var(--bad)">deadline</text>`;
  const pts=W.map(w=>[x(parse(w.date).getTime()),y(w.kg)]);
  s+='<g clip-path="url(#plotClip)">';
  s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  // highest weight gets its own marker (a star)
  let hiI=0;W.forEach((w,i)=>{if(w.kg>W[hiI].kg)hiI=i;});
  W.forEach((w,i)=>{if(i!==hiI)s+=`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="${W.length>60?2.5:4}" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`;});
  const [hx,hy]=pts[hiI],star=[...Array(10)].map((_,k)=>{const r=k%2?3.4:8,a=Math.PI/5*k-Math.PI/2;return (hx+r*Math.cos(a)).toFixed(1)+','+(hy+r*Math.sin(a)).toFixed(1);}).join(' ');
  s+=`<polygon points="${star}" fill="var(--text)" stroke="var(--surface)" stroke-width="1.2"/><text x="${hx-11}" y="${hy-6}" text-anchor="end" font-size="10" font-weight="700" fill="var(--text)">${fmtKg(W[hiI].kg)} kg</text>`;
  s+='</g></svg>';
  wrap.insertAdjacentHTML('afterbegin',s);
  const svg=wrap.querySelector('svg'),tip=$('tip');
  svg.addEventListener('mousemove',ev=>{const r=svg.getBoundingClientRect(),mx=ev.clientX-r.left;let bi=0,bd=1e9;pts.forEach((p,i)=>{const dd=Math.abs(p[0]-mx);if(dd<bd){bd=dd;bi=i}});
    if(bd>40||pts[bi][0]<m.l){tip.style.display='none';return;}tip.style.display='block';tip.style.left=pts[bi][0]+'px';tip.style.top=pts[bi][1]+'px';tip.textContent=fmtD(W[bi].date)+' · '+fmtKg(W[bi].kg)+' kg';});
  svg.addEventListener('mouseleave',()=>tip.style.display='none');
}

function renderActions(){
  if(MODS[mod].rating){let h='';for(let m=0;m<12;m++){const a=iso(new Date(year,m,1)),b=iso(new Date(year,m+1,0));
      h+=smTile(a>todayIso?null:modScore(mod,a,b),new Date(year,m,1).toLocaleDateString(LOC,{month:'short'}));}
    $('actions').innerHTML=`<div class="smgrid">${h}</div>`;return;}
  const T=trained(),pw=perWeek();
  const jan1=new Date(year,0,1),dec31=new Date(year,11,31);
  let cnt=0,months='';
  for(let mo=0;mo<12;mo++){
    const f=new Date(year,mo,1),n=new Date(year,mo+1,0).getDate(),lead=(f.getDay()+6)%7;let c=0,g='';
    for(let i=0;i<lead;i++)g+='<i></i>';
    for(let d=1;d<=n;d++){const k=iso(new Date(year,mo,d)),on=T.has(k);if(on){c++;cnt++;}
      g+=`<button class="yd${on?' on':''}${k===todayIso?' today':''}${k>todayIso?' fut':''}" data-wd="${k}" title="${fmtD(k)}" aria-pressed="${on}">${on?crossSVG(k,k===todayIso):''}</button>`;}
    months+=`<div class="ym"><div class="ymh"><b>${f.toLocaleDateString(LOC,{month:'short'})}</b>${c?`<span>${c}</span>`:''}</div><div class="ymg">${g}</div></div>`;
  }
  // weeks on plan: finished weeks of this year since the first training day, plus this week once it already hits the plan
  const first=[...T].filter(k=>k.startsWith(year+'-')).sort()[0];
  let wTot=0,wHit=0,wStreak=0,run=0;
  if(first){
    const thisMon=iso(mondayOf(new Date()));
    for(let m=mondayOf(parse(first));iso(m)<=thisMon&&m<=dec31;m.setDate(m.getDate()+7)){
      let n=0;for(let i=0;i<7;i++){const d=new Date(m);d.setDate(d.getDate()+i);if(T.has(iso(d)))n++;}
      const current=iso(m)===thisMon,hit=pw&&n>=pw;
      if(current&&!hit)continue;
      wTot++;if(hit){wHit++;run++;}else run=0;
    }
    wStreak=run;
  }
  // ---- year goal: plan (days/week) x weeks from Jan 1 (or the goal start, if later) to Dec 31
  const yStart=[iso(jan1),goalStart()].sort()[1]>iso(dec31)?null:[iso(jan1),goalStart()].sort()[1];
  const span=k=>(parse(k)-parse(yStart))/864e5+1; // days since yStart, inclusive
  const yGoal=pw&&yStart?Math.round(pw*span(iso(dec31))/7):0;
  const expected=pw&&yStart&&todayIso>=yStart?Math.min(yGoal,Math.round(pw*span(todayIso<=iso(dec31)?todayIso:iso(dec31))/7)):0;
  const gp=yGoal?Math.min(100,Math.round(cnt/yGoal*100)):0, ep=yGoal?Math.min(100,Math.round(expected/yGoal*100)):0;
  const pace=cnt-expected;
  const paceTxt=expected?(pace===0?'on pace':Math.abs(pace)+' '+(Math.abs(pace)===1?'day':'days')+' '+(pace>0?'ahead':'behind')):'';
  renderSum();
  $('actions').innerHTML=`<div class="ygrid">${months}</div>`+countTxt(cnt,'in '+year);
}

// Top summary of the Action block: done / goal for the period shown (week, month or year).
// The goal is the plan (days per week) spread over the days of that period, counted from the goal start.
function renderSum(){
  const T=trained(),pw=perWeek();let a,b,label;
  if(actView==='week'){const e=new Date(weekStart);e.setDate(e.getDate()+6);a=iso(weekStart);b=iso(e);label=iso(mondayOf(new Date()))===a?'this week':'in week '+isoWeek(weekStart);}
  else if(actView==='month'){const f=monthStart,l=new Date(f.getFullYear(),f.getMonth()+1,0);a=iso(f);b=iso(l);label='in '+f.toLocaleDateString(LOC,{month:'long'});}
  else{a=year+'-01-01';b=year+'-12-31';label='in '+year;}
  const from=[a,actStart()].sort()[1];
  const days=(x,y)=>x>y?0:(parse(y)-parse(x))/864e5+1;
  // count only days from the goal start on (week view: the whole week), so earlier training doesn't inflate the pace
  const cnt=[...T].filter(k=>k>=(actView==='week'?a:from)&&k<=b).length;
  const goal=pw?(actView==='week'?(b>=actStart()?pw:0):Math.round(pw*days(from,b)/7)):0;
  // pace: training counts the whole week; Food/Sleep only from the first tick (a module started mid-week isn't 'behind')
  const exp=pw&&todayIso>=from?Math.min(goal,Math.round(pw*days(actView==='week'&&mod==='training'?a:from,todayIso<b?todayIso:b)/7)):0;
  const pace=cnt-exp,gp=goal?Math.min(100,Math.round(cnt/goal*100)):0;
  const fresh=mod!=='training'&&!cnt&&actStart()===todayIso; // nothing ticked yet: no 'behind' on day one
  const paceTxt=fresh?'':goal&&todayIso>=from&&todayIso<=b?(pace>=0&&cnt>=goal?'goal reached':pace===0?'on pace':Math.abs(pace)+' '+(Math.abs(pace)===1?'day':'days')+' '+(pace>0?'ahead':'behind')):'';
  if(mod!=='training'){ // Food/Sleep: score vs target (partial days and bonus count)
    const sc=modScore(mod,a,b),tg=targetOf(mod),left=sc==null?'<span class="muted">Tick your first actions</span>':`<span><b>${sc}</b> / ${tg} score ${label}</span>`;
    const pk=actView==='week'?addD(a,-7):actView==='month'?iso(new Date(parse(a).getFullYear(),parse(a).getMonth()-1,1)):(+a.slice(0,4)-1)+'-01-01';
    const pb=actView==='week'?addD(pk,6):actView==='month'?iso(new Date(parse(pk).getFullYear(),parse(pk).getMonth()+1,0)):(+a.slice(0,4)-1)+'-12-31';
    const prv=modScore(mod,pk,pb),pl={week:'last week',month:'last month',year:'last year'}[actView];
    const dl=sc!=null&&prv!=null?`<span class="dl ${sc-prv>=0?'up':'dn'}" title="vs ${pl}">${sc-prv>=0?'+':''}${sc-prv}</span> · `:'';
    const r=sc==null?'':`<span class="psc${sc>=tg?' ok':''}">${sc>=tg?'on target':(tg-sc)+' to go'}</span>`;
    $('actSum').innerHTML=`<div class="calsum">${left}${r}</div><div class="track thin"><i style="width:${sc==null?0:Math.min(100,sc/tg*100)}%;background:var(--accent)"></i></div>`;
    $('histSum').textContent=sc==null?'':`${label.replace(/^in /,'')} · ${sc} / ${tg}`;return;}
  $('histSum').textContent=`${label.replace(/^in /,'')} · ${cnt}${goal?' / '+goal:''}`;
  $('actSum').innerHTML=`<div class="calsum"><span><b>${cnt}</b>${goal?' / '+goal:''} days ${label}</span>${paceTxt?`<span>${paceTxt}</span>`:''}</div>
    ${goal?`<div class="track thin"><i style="width:${gp}%;background:var(--accent)"></i></div>`:''}`;
}

// ---------- dialogs ----------
function dialog(html,onSave,okLabel){
  const f=$('dlgForm');f.innerHTML=html+`<div class="row" style="justify-content:flex-end;margin-top:18px"><button class="ghost" type="button" onclick="this.closest('dialog').close('cancel')">Cancel</button><button class="primary" value="ok">${okLabel||'Save'}</button></div>`;
  const dlg=$('dlg');dlg.returnValue='';dlg.showModal();
  dlg.onclose=()=>{if(dlg.returnValue==='ok')onSave(f);};
}
function openEdit(k){
  if(k==='modplan'){const M=MODS[mod];
    return dialog(`<h3>${M.label} plan</h3><p>Your week score target. A perfect day = 100${mod==='food'?' (bonus can make up for a missed item)':''}. Below 100 leaves room for a night out or a bad night.</p><label>Target week score</label><input name="n" type="number" min="30" max="120" step="5" value="${targetOf(mod)}">`,
      f=>{const n=Math.min(120,Math.max(30,parseInt(f.n.value,10)||0));if(n)saveSettings({[M.target]:String(n)});});}
  const st=S.settings;
  if(mod!=='training'&&(k==='goal'||k==='deadline'||k==='plan')){const M=MODS[mod];
    if(k==='plan')return openEdit('modplan');
    if(k==='goal'){const cur=$('goalView').innerText,curN=$('goalSub').innerText;
      return dialog(`<h3>${M.label} goal</h3><p>A short title, plus a few lines that make it specific and measurable.</p><label>Title</label><input name="g" value="${esc(cur)}"><label>Details</label><textarea name="n" rows="4" style="width:100%">${esc(curN)}</textarea>`,
        f=>saveSettings({[mod+'Goal']:f.g.value.trim()||M.goal,[mod+'GoalNote']:f.n.value.trim()}));}
    return dialog(`<h3>${M.label} deadline</h3><p>Until when do you commit to this? Goal + deadline = your objective.</p><label>Date</label><input name="d" type="date" value="${esc(st[mod+'Deadline']||st.deadline||'')}">`,
      f=>saveSettings({[mod+'Deadline']:f.d.value}));}
  if(k==='goal')dialog(`<h3>Goal</h3><p>Your target weight.</p><label>Target weight (kg)</label><input name="targetKg" type="number" step="0.1" min="20" max="300" value="${esc(st.targetKg)}"><label>Goal start (progress is measured from this date)</label><input name="goalStart" type="date" value="${esc(goalStart())}">`,
    f=>saveSettings({targetKg:f.targetKg.value,goalStart:f.goalStart.value||todayIso}));
  if(k==='deadline')dialog(`<h3>Deadline</h3><p>When should you reach your target weight? Goal + deadline = your objective.</p><label>Date</label><input name="deadline" type="date" value="${esc(st.deadline)}">`,
    f=>saveSettings({deadline:f.deadline.value}));
  if(k==='plan')dialog(`<h3>Plan</h3><p>How many days per week will you train?</p><label>Training days per week</label><input name="daysPerWeek" type="number" min="1" max="7" step="1" value="${esc(st.daysPerWeek)}">`,

}

// ---------- intro: a short motivational run-through, once a day ----------
let introRun=0;
function playIntro(force){
  if(!force){try{if(localStorage.getItem('training.intro')===todayIso)return;}catch(e){}
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;}
  // The method, built up line by line: Goal + Deadline = Objective, + Plan = Strategy, + Consistent action = Results
  const today=(totalScore(scoresAt('day',todayIso))||0)>=80; // 'Done today' once the whole day scores 80+
  const X='<span class="in-x"><svg viewBox="0 0 100 100"><path d="M22 23 Q50 48 78 77"/><path d="M78 22 Q52 51 22 78"/></svg></span>';
  const run=++introRun;
  const stage=$('inStage'),el=$('intro');$('inDots').innerHTML='';
  // Kinetic type: each word lands big in the centre, then tucks into a small list at the top.
  // Finale: TAKE ACTION. with a big hand-drawn cross stamped over it.
  // The formula: Goal + Deadline = Objective, + Plan = Strategy, + Consistent action = Results
  // Calm build-up: one stable board, one line at a time; each outcome lands after its term.
  // [term, outcome sentence, negative, formula pieces this line adds at the top]
  const rows=[
    ['Goal without deadline','It\'s only a dream.',true,[]],
    ['Goal <i>+</i> deadline','You have an objective.',false,['Goal','Deadline']],
    ['Goal <i>+</i> deadline <i>+</i> plan','You have a strategy.',false,['Plan']],
    ['Goal <i>+</i> deadline <i>+</i> plan <i>+</i> <span class="k6-u">consistency in action</span>','You get results.',false,['Consistency in action']]];
  stage.innerHTML=`<div class="k5">
    <div class="k6-top">${rows.flatMap(r=>r[3]).map((w,n)=>`<span>${n?'<i>+</i>':''}${w}</span>`).join('')}</div>
    <div class="k6">${rows.map(([t,o,neg])=>`<div class="k6-row${neg?' neg':''}"><div class="k6-t">${t}</div><div class="k6-o">${o}</div></div>`).join('')}</div>
    <div class="k5-stage"><div class="k5-end"><div class="k5-cta">${today?'Done<br>today.':'Take<br>action.'}</div>
        <svg class="k5-x" viewBox="0 0 100 100"><path d="M14 16 Q50 46 86 84"/><path d="M85 14 Q53 51 15 87"/></svg></div>
    </div></div>`;
  el.hidden=false;
  const R=[...stage.querySelectorAll('.k6-row')],E=stage.querySelector('.k5-end'),K=stage.querySelector('.k5'),B=stage.querySelector('.k6'),TOP=[...stage.querySelectorAll('.k6-top span')];
  let topN=0;const addTop=n=>{for(let k=0;k<rows[n][3].length;k++)TOP[topN++].classList.add('on');};
  const parts=[];const step=(fx,gap)=>parts.push({fx,gap});
  R.forEach((r,n)=>{
    step(()=>{R.forEach((x,k)=>x.classList.toggle('past',k<n));r.classList.add('in');},680);   // term
    step(()=>{r.classList.add('eq');addTop(n);},n===0?1350:1300);                          // outcome + formula grows at the top
    if(n===0)step(()=>r.classList.add('gone'),450);                                          // fantasy fades out of the way
  });
  step(()=>B.classList.add('out'),600);
  step(()=>E.classList.add('in'),700);
  step(()=>{E.classList.add('stamp');K.classList.add('shake');},1700);
  const gaps=parts.map(p=>p.gap);let i=0,timer;const total=gaps.reduce((a,b)=>a+b,0)+1700;
  // pausable timeline: hold the screen to pause, release to continue
  const bar=$('inBar');let fn=null,due=0,left=0,paused=false,barLeft=total,barT0=0,done=false;
  const sched=(f,ms)=>{fn=f;left=ms;due=performance.now()+ms;timer=setTimeout(()=>{fn=null;f();},ms);};
  const runBar=()=>{barT0=performance.now();bar.style.transition=`width ${barLeft}ms linear`;bar.style.width='100%';};
  bar.style.transition='none';bar.style.width='0';requestAnimationFrame(runBar);
  const end=()=>{if(done)return;done=true;clearTimeout(timer);el.classList.remove('paused');el.classList.add('out');setTimeout(()=>{el.hidden=true;el.classList.remove('out');},450);try{localStorage.setItem('training.intro',todayIso)}catch(e){}};
  const next=()=>{if(i>=parts.length){sched(end,1800);return;}const p=parts[i++];p.fx();sched(next,p.gap||300);};
  const pause=()=>{if(paused||done)return;paused=true;clearTimeout(timer);left=Math.max(0,due-performance.now());
    const w=getComputedStyle(bar).width;bar.style.transition='none';bar.style.width=w;barLeft=Math.max(0,barLeft-(performance.now()-barT0));el.classList.add('paused');};
  const resume=()=>{if(!paused||done)return;paused=false;el.classList.remove('paused');if(fn){const f=fn;due=performance.now()+left;timer=setTimeout(()=>{fn=null;f();},left);}runBar();};
  // pause/play button + hold-to-pause anywhere else
  const PI='<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>',PL='<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',pp=$('inPause');
  const setPP=()=>{pp.innerHTML=paused?PL:PI;pp.setAttribute('aria-label',paused?'Play':'Pause');};
  let held=false;setPP();
  pp.onclick=e=>{e.stopPropagation();paused?resume():pause();setPP();};
  $('inSkip').onclick=e=>{e.stopPropagation();end();};
  el.onpointerdown=e=>{if(e.target.closest('#inSkip,#inPause')||paused)return;held=true;pause();setPP();};
  el.onpointerup=el.onpointercancel=el.onpointerleave=()=>{if(held){held=false;resume();setPP();}};
  el.onclick=null;el.oncontextmenu=e=>e.preventDefault();
  sched(next,250);
  // safety: never block the dashboard (only counts time while not paused)
  const guard=setInterval(()=>{if(run!==introRun||done){clearInterval(guard);return;}if(!paused&&performance.now()>due+3000)end();},1000);
}
// log in once per device: name + password from the sheet's Users tab -> token kept on this device
function askLogin(msg){const dlg=$('dlg'),f=$('dlgForm');if(dlg.open)return;
  // own login form: Enter logs in (the generic dialog would treat Enter as Cancel), stays open while logging in
  f.innerHTML=`<h3>Log in</h3><p>Once per device. You stay logged in after that.</p>
    <label>Name</label><input name="name" autocomplete="username" autocapitalize="words" autocorrect="off" spellcheck="false" value="${auth?auth.name:(ls.get('training.lastName','')||'')}">
    <label>Password</label><input name="pw" type="password" autocomplete="current-password">
    <p class="lerr" style="color:var(--warn);font-weight:600;min-height:1.2em;margin:10px 0 0">${msg||''}</p>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="primary" type="submit" style="min-width:110px">Log in</button></div>`;
  const btn=f.querySelector('button'),err=f.querySelector('.lerr');
  f.onsubmit=async e=>{e.preventDefault();const name=f.name.value.trim(),pw=f.pw.value.trim();
    if(!name||!pw){err.textContent='Fill in both fields';return;}
    btn.disabled=true;btn.textContent='Logging in…';err.textContent='';setSync('busy','Logging in…');
    try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'login',name,password:pw})});
      const j=await r.json();if(!j.ok)throw new Error(j.error||'Error');
      auth={name:j.user,token:j.token};ls.set(LS_AUTH,auth);ls.set('training.lastName',j.user);
      f.onsubmit=null;dlg.close();setData(j);showWho();setSync('ok','Connected to Google');render();
    }catch(e2){err.textContent=/fetch|network|load failed/i.test(e2.message)?'No connection, try again':e2.message;
      btn.disabled=false;btn.textContent='Log in';setSync('err','Not logged in');f.pw.select();}};
  dlg.onclose=()=>{f.onsubmit=null;};
  dlg.returnValue='';dlg.showModal();setTimeout(()=>(f.name.value?f.pw:f.name).focus(),50);}
$('who').onclick=()=>{if(!auth)return askLogin();
  dialog(`<h3>${auth.name}</h3><p>Logged in on this device. Log out to switch to another person.</p>`,()=>{logout();askLogin();},'Log out');};
