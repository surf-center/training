<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f8;--surface:#fff;--surface2:#f1f3f7;--border:#e3e6ec;
  --text:#0f172a;--text2:#334155;--muted:#64748b;--muted2:#94a3b8;
  --accent:#2563eb;--accent-soft:#dbeafe;--good:#059669;--good-soft:#d1fae5;--warn:#d97706;--bad:#dc2626;
  --cell:#e8ebf0;--cell-done:#2563eb;--cell-today:#0f172a;
  --font:'Poppins',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0f17;--surface:#131a26;--surface2:#1a2332;--border:#253044;
  --text:#e8edf5;--text2:#c3ccda;--muted:#8a96a8;--muted2:#5d6a7d;
  --accent:#60a5fa;--accent-soft:#1e3a5f;--good:#34d399;--good-soft:#064e3b;
  --cell:#1f2a3b;--cell-done:#60a5fa;--cell-today:#e8edf5;
}}
:root[data-theme="dark"]{
  --bg:#0b0f17;--surface:#131a26;--surface2:#1a2332;--border:#253044;
  --text:#e8edf5;--text2:#c3ccda;--muted:#8a96a8;--muted2:#5d6a7d;
  --accent:#60a5fa;--accent-soft:#1e3a5f;--good:#34d399;--good-soft:#064e3b;
  --cell:#1f2a3b;--cell-done:#60a5fa;--cell-today:#e8edf5;
}
*{box-sizing:border-box}
html{accent-color:#2563eb}
::selection{background:var(--accent-soft);color:var(--text)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 16px calc(60px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.3px}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted2)}
.dot.ok{background:var(--good)}.dot.busy{background:var(--warn)}.dot.err{background:var(--bad)}
.hdr-right{display:flex;align-items:center;gap:8px}
.period{display:flex;gap:6px}
.period select{width:auto;font-size:12px;font-weight:600;padding:7px 8px;border-radius:10px;background:var(--surface);cursor:pointer}
.iconbtn{border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.label{flex-wrap:wrap;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.edit{font-size:11px;font-weight:600;color:var(--accent);background:none;border:none;cursor:pointer;padding:0;text-transform:none;letter-spacing:0;font-family:var(--font)}
.grid3{display:grid;grid-template-columns:1.3fr .8fr 1.3fr;gap:16px;margin-bottom:16px}
.grid3 .card{margin:0}
.big{font-size:17px;font-weight:700;margin-top:8px;white-space:pre-wrap}
.text{font-size:13px;color:var(--text2);margin-top:8px;white-space:pre-wrap}
.empty{color:var(--muted2);font-style:italic;font-weight:400}
.countdown{font-size:28px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--muted)}
.step{display:inline-block;font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-right:6px}
input,textarea,select{font-family:var(--font);font-size:13px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:8px 10px;width:100%}
textarea{min-height:90px;resize:vertical}
button.primary{font-family:var(--font);font-size:13px;font-weight:600;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:8px 14px;cursor:pointer;white-space:nowrap}
button.ghost{font-family:var(--font);font-size:13px;font-weight:600;background:none;color:var(--muted);border:1px solid var(--border);border-radius:9px;padding:8px 14px;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:12px 0 4px}
.stat .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.chartwrap{position:relative;margin-top:10px;overflow:hidden}
.chartwrap svg{display:block;max-width:100%}
svg text{font-family:var(--font)}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);font-size:11px;font-weight:600;padding:5px 8px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-120%);display:none}
.wlist{margin-top:12px;max-height:150px;overflow:auto;font-size:12px;border-top:1px solid var(--border)}
.wlist div{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px solid var(--border);color:var(--text2)}
.wlist button{background:none;border:none;color:var(--muted2);cursor:pointer;font-size:13px}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.navbar{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0}
.navbar button{border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:8px;width:28px;height:28px;cursor:pointer}
.navbar b{font-size:13px;color:var(--text);text-align:center;font-weight:700}
/* this week */
.week{display:grid;grid-template-columns:repeat(7,minmax(32px,1fr)) 56px;gap:6px;align-items:center;margin-top:14px}
.week .hd{font-size:10px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.4px;line-height:1.25}
.week .hd small{display:block;font-weight:500;font-size:10px;text-transform:none;letter-spacing:0;color:var(--muted2)}
.week .hd.today{color:var(--accent)}.week .hd.today small{color:var(--accent)}
.week .tot{font-size:12px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.chk{height:40px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:transparent;transition:background .12s,border-color .12s}
.chk:hover{border-color:var(--cell-done)}
.chk.on{background:var(--cell-done);border-color:var(--cell-done);color:#fff}
.chk.today{border-color:var(--text)}
.chk.on.today{border-color:var(--cell-done);box-shadow:0 0 0 2px var(--text)}
.chk.fut{opacity:.55}
.action{margin-top:16px}
.ahead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ahead .name{font-weight:700;font-size:14px}
.ahead .meta{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ahead .meta b{color:var(--text)}
.heat{margin-top:6px}
.more{display:block;margin:14px auto 0;font-size:12px;padding:6px 14px}
.mhead{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 10px}
.mhead button{border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:8px;width:30px;height:30px;cursor:pointer}
.mhead b{font-size:15px;min-width:140px;text-align:center}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:560px;margin:0 auto}
.month .dn{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.4px}
.month .day{aspect-ratio:1/1;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;font-family:var(--font);font-size:14px;font-weight:600;color:var(--text2);display:flex;align-items:center;justify-content:center;padding:0}
.month .day.on{background:var(--cell-done);border-color:var(--cell-done);color:#fff}
.month .day.today{border-color:var(--text)}
.month .day.fut{opacity:.55}
.month .blank{visibility:hidden}
.month .msum{grid-column:1/-1;text-align:center;font-size:13px;color:var(--muted);margin-top:4px}
.month .msum b{color:var(--text)}
.calsum{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-size:13px;color:var(--muted)}
.calsum b{font-size:22px;font-weight:800;color:var(--text);margin-right:2px}
.track.thin{height:4px;border:none;margin-top:8px}
.zoom{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.zoom span{min-width:52px;text-align:right}
.zoom input{width:90px;padding:0;background:none;border:none;accent-color:#2563eb;box-shadow:none}
.cal-title{font-size:13px;color:var(--text);letter-spacing:.4px}
.action .ahead .meta{font-size:13px}
.score{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:center;margin-top:14px;padding:16px 18px;border-radius:14px;background:var(--accent-soft)}
.score .pts{font-size:34px;font-weight:800;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.score .pts small{display:block;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-top:6px}
.score .lvl{font-size:15px;font-weight:800}
.score .lvl span{font-size:12px;font-weight:600;color:var(--muted);margin-left:6px}
.score .track{margin-top:6px;background:var(--surface)}
.score .how{grid-column:1/-1;font-size:11px;color:var(--muted)}
.score .wk{font-size:12px;color:var(--text2);margin-top:6px}
.score .wk b{color:var(--accent)}
.heat svg{display:block;width:100%;height:auto}
.tot.hit{color:var(--cell-done)}
.heat svg rect.c{cursor:pointer;transition:opacity .1s}
.heat svg rect.c:hover{opacity:.7}
/* process timeline */
.process{padding:22px 20px 18px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);position:relative;margin-top:16px}
.steps::before{content:"";position:absolute;left:12.5%;right:12.5%;top:17px;height:3px;background:var(--border);border-radius:2px}
.steps .fill{position:absolute;left:12.5%;top:17px;height:3px;background:var(--accent);border-radius:2px;transition:width .3s}
.st{position:relative;text-align:center;padding:0 6px;cursor:pointer}
.st .n{width:37px;height:37px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:var(--surface);border:3px solid var(--border);color:var(--muted);position:relative;z-index:1}
.st.ok .n{background:var(--accent);border-color:var(--accent);color:#fff}
.st.now .n{border-color:var(--text);color:var(--text)}
.st .t{font-weight:700;font-size:13px;margin-top:8px}
.st .v{font-size:12px;color:var(--text2);margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;padding-top:16px;border-top:1px dashed var(--border)}
.bar .top{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
.bar .top b{color:var(--text);font-size:12px}
.track{height:10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;border-radius:6px;transition:width .3s}
.bar .ends{display:flex;justify-content:space-between;font-size:10px;color:var(--muted2);margin-top:4px}
@media (max-width:560px){
  .steps{grid-template-columns:repeat(4,1fr)}
  .st .v{display:none}
  .st .t{font-size:11px}
  .bars{grid-template-columns:1fr}
}
dialog{border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--text);padding:22px;max-width:440px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(15,23,42,.45)}
dialog h3{margin:0 0 6px;font-size:16px}
dialog p{font-size:12px;color:var(--muted);margin:0 0 14px}
dialog label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin:10px 0 4px}
@media (max-width:820px){.grid3{grid-template-columns:1fr}}
@media (max-width:600px){header{flex-wrap:wrap}.hdr-right{width:100%}.period{flex:1;min-width:0}.period select{min-width:0}.period #selWeek{flex:1}}
@media (max-width:560px){
  .week{grid-template-columns:repeat(7,1fr) 40px;gap:4px}
  .chk{height:36px}
}
/* ===== action views + hand-drawn crosses ===== */
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;text-transform:none;letter-spacing:0}
.seg button{border:none;background:none;font-family:var(--font);font-size:12px;font-weight:800;color:var(--muted);padding:6px 12px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(15,23,42,.12)}
#actionCard .view{display:none}
#actionCard[data-view="week"] #week,#actionCard[data-view="month"] #monthView,#actionCard[data-view="year"] #yearView{display:block}
.chk,.month .day{position:relative;overflow:visible}
.chk.on,.month .day.on{background:var(--surface2);border-color:var(--border);color:var(--text2)}
.chk.on.today,.month .day.on.today{border-color:var(--text);box-shadow:none}
.xm{position:absolute;left:-24%;top:-24%;width:148%;height:148%;pointer-events:none;overflow:visible;z-index:2}
.xm path{fill:none;stroke:var(--text);stroke-width:16;stroke-linecap:round;stroke-linejoin:round}
.xm.new path{stroke-dasharray:110;stroke-dashoffset:110;animation:draw .18s ease-out forwards}
.xm.new path+path{animation-delay:.14s}
@keyframes draw{to{stroke-dashoffset:0}}
.heat svg .yx{fill:none;stroke:var(--text);stroke-width:3.4;stroke-linecap:round;pointer-events:none}
button.big{font-size:13px;padding:9px 18px;margin-left:auto;line-height:inherit}
/* ===== bold & clean ===== */
.ttl{font-family:var(--font);font-size:20px;font-weight:800;text-transform:none;letter-spacing:-.3px;color:var(--text)}
body{font-size:15px}
h1{font-size:30px;font-weight:900;letter-spacing:-.6px}
.card{border:none;border-radius:22px;padding:22px 22px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card{box-shadow:none;border:1px solid var(--border)}}
.label{font-size:12px;font-weight:800;letter-spacing:.8px;color:var(--text)}
.step{font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;background:var(--accent);color:#fff}
.edit{font-size:12px;font-weight:700}
.countdown{font-size:38px;font-weight:900;letter-spacing:-1px;margin-top:8px}
.sub{font-size:13px;font-weight:500}
.steps::before,.steps .fill{top:21px;height:5px;border-radius:3px}
.st .n{width:46px;height:46px;font-size:16px;font-weight:900;border-width:4px}
.st .t{font-size:14px;font-weight:800;margin-top:10px}
.st .v{font-size:13px;font-weight:600}
.bars{gap:24px;margin-top:22px;padding-top:18px}
.bar .top{font-size:13px;font-weight:700;color:var(--text2)}
.bar .top b{font-size:20px;font-weight:900;letter-spacing:-.4px}
.track{height:14px;border:none;border-radius:8px}
.track i{border-radius:8px}
.bar .ends{font-size:11px;font-weight:600}
.week{gap:8px}
.week .hd{font-size:11px;font-weight:800}
.week .tot{font-size:16px;font-weight:900}
.chk{height:auto;aspect-ratio:1/1;max-height:56px;border-radius:14px;border-width:2px}
.calsum{font-size:14px;font-weight:600}
.calsum b{font-size:34px;font-weight:900;letter-spacing:-1px}
.track.thin{height:8px}
.stat .v{font-size:32px;font-weight:900;letter-spacing:-.8px}
.stat .l{font-size:11px;font-weight:800}
.stats{gap:36px}
.month .day{font-size:15px;font-weight:800;border-radius:14px}
button.primary{font-weight:800;border-radius:11px;padding:10px 18px}
button.ghost{font-weight:700;border-radius:11px}
.period select{font-weight:700;border-radius:11px}
.iconbtn{border-radius:11px}
@media (max-width:560px){.countdown{font-size:32px}.stat .v{font-size:28px}.chk{border-radius:12px}.st .n{width:40px;height:40px}.steps::before,.steps .fill{top:18px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Training</h1>
      <div class="sync"><span class="dot" id="dot"></span><span id="syncText">Local</span></div>
    </div>
    <div class="hdr-right">
      <div class="period" title="Week and year shown in Action and Calendar">
        <select id="selYear" aria-label="Year"></select>
        <select id="selWeek" aria-label="Week"></select>
      </div>
      <button class="iconbtn" id="btnSettings" title="Google Sheet connection">⚙</button>
    </div>
  </header>

  <!-- Process timeline -->
  <div class="card process">
    <div class="label"><span class="ttl">Progress</span></div>
    <div class="steps" id="steps"></div>
    <div class="bars" id="bars"></div>
  </div>

  <!-- This week -->
  <div class="card" id="actionCard">
    <div class="label">
      <span><span class="step">4</span>Action</span>
      <div class="seg" role="tablist" id="viewSeg">
        <button data-view="week" role="tab">Week</button><button data-view="month" role="tab">Month</button><button data-view="year" role="tab">Year</button>
      </div>
    </div>
    <div id="actSum"></div>
    <div id="week" class="view"></div>
    <div id="monthView" class="view">
      <div class="mhead"><b id="mLbl"></b></div>
      <div class="month" id="month"></div>
    </div>
    <div id="yearView" class="view"><div id="actions"></div></div>
  </div>

  <!-- Goal / Deadline / Plan -->
  <div class="grid3">
    <div class="card">
      <div class="label"><span><span class="step">1</span>Goal</span><button class="edit" data-edit="goal">Edit</button></div>
      <div class="countdown" id="goalView">–</div>
      <div class="sub" id="goalSub"></div>
    </div>
    <div class="card">
      <div class="label"><span><span class="step">2</span>Deadline</span><button class="edit" data-edit="deadline">Edit</button></div>
      <div class="countdown" id="dlCount">–</div>
      <div class="sub" id="dlDate"></div>
    </div>
    <div class="card">
      <div class="label"><span><span class="step">3</span>Plan</span><button class="edit" data-edit="plan">Edit</button></div>
      <div class="countdown" id="planView">–</div>
      <div class="sub" id="planSub"></div>
    </div>
  </div>


  <!-- Weight -->
  <div class="card">
    <div class="label"><span>Weight</span>
      <label class="zoom" title="Zoom the chart"><span id="zLbl">All</span><input type="range" id="zoom" min="0" max="4" step="1" value="0"></label>
    </div>
    <div class="stats" id="wStats"></div>
    <div class="chartwrap" id="chartWrap"><div class="tip" id="tip"></div></div>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>Measured</span>
      <span><i style="background:var(--good)"></i>Target</span>
      <span><i style="background:var(--muted2)"></i>Plan</span>
      <span><i style="background:var(--accent);opacity:.5"></i>Forecast</span>
      <span>★ Highest</span>
    </div>
    <div class="row">
      <input type="date" id="wDate" style="max-width:170px">
      <input type="number" id="wKg" step="0.1" min="20" max="300" placeholder="kg" style="max-width:110px">
      <button class="primary" id="wAdd">Save</button>
      <button class="ghost big" id="wListToggle">Measurements ▾</button>
    </div>
    <div class="wlist" id="wList" hidden></div>
  </div>

</div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script src="config.js"></script>
<script>
// ---------- Storage: Google Sheet (Apps Script) or local ----------
const LS_CFG='training.cfg', LS_DATA='training.data';
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
// config.js (optional, next to this file) pre-fills the connection; the gear icon overrides it.
// The web app URL is not secret, so it is built in. The key is entered once per device (or comes from config.js locally).
const DEFAULT_URL='https://script.google.com/macros/s/AKfycbzZZcqDX0pMBG9Lu0TsbTM_HTidZblEwPNMPAlrH_S0ekKSBVOZ8qQoqcRpSbC2CfRn/exec';
let cfg=ls.get(LS_CFG,null)||(window.TRAINING_CFG&&window.TRAINING_CFG.key?{url:window.TRAINING_CFG.url||DEFAULT_URL,key:window.TRAINING_CFG.key}:{url:DEFAULT_URL,key:''});
if(!cfg.url)cfg.url=DEFAULT_URL;
let S={settings:{},weight:[],actions:[]};
const remote=()=>!!(cfg.url&&cfg.key);

function setSync(state,text){document.getElementById('dot').className='dot '+(state||'');document.getElementById('syncText').textContent=text;}

async function load(){
  if(!remote()){S=ls.get(LS_DATA,S);setSync('', 'Local (not connected yet)');render();return;}
  setSync('busy','Loading…');
  try{
    const r=await fetch(cfg.url+'?key='+encodeURIComponent(cfg.key));
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'Error');
    S={settings:j.settings||{},weight:j.weight||[],actions:j.actions||[]};
    ls.set(LS_DATA,S);setSync('ok','Connected to Google Sheet');
  }catch(e){S=ls.get(LS_DATA,S);setSync('err','Sheet unreachable: '+e.message);if(/invalid key/i.test(e.message))setTimeout(askKey,300);}
  render();
}

// Optimistic: update locally first, then write to the sheet.
async function save(payload){
  ls.set(LS_DATA,S);render();
  if(!remote())return;
  setSync('busy','Saving…');
  try{
    const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,key:cfg.key})});
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'Error');
    S={settings:j.settings||{},weight:j.weight||[],actions:j.actions||[]};
    ls.set(LS_DATA,S);setSync('ok','Saved to Google Sheet');render();
  }catch(e){setSync('err','Not saved: '+e.message);}
}
function saveSettings(obj){Object.assign(S.settings,obj);save({type:'settings',settings:obj});}

// ---------- helpers ----------
const LOC='en-GB';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d);};
const todayIso=iso(new Date());
const fmtD=s=>parse(s).toLocaleDateString(LOC,{day:'numeric',month:'short',year:'numeric'});
const fmtDs=s=>parse(s).toLocaleDateString(LOC,{day:'numeric',month:'short'});
const fmtKg=v=>(Math.round(v*10)/10).toLocaleString(LOC,{minimumFractionDigits:1,maximumFractionDigits:1});
// One action: ticking off a training day.
const ACTION='Training';
const perWeek=()=>{const n=parseInt(S.settings.daysPerWeek,10);return n>=1&&n<=7?n:0;};
const trained=()=>new Set(S.actions.filter(a=>a.action===ACTION).map(a=>a.date));
const mondayOf=d=>{const m=new Date(d.getFullYear(),d.getMonth(),d.getDate());m.setDate(m.getDate()-((m.getDay()+6)%7));return m;};
const isoWeek=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7);};
// Goal start: progress (time, weight, plan line) is measured from the day the goal was set.
const goalStart=()=>S.settings.goalStart||todayIso;
function startWeight(W){ // last measurement before the goal start day, else the first one on/after it
  if(!W.length)return null;
  const before=W.filter(w=>w.date<goalStart());
  return before.length?before[before.length-1]:W[0];
}
// Trend: linear fit over the last 6 weeks of measurements (at least 3 points).
function trend(W){
  if(W.length<2)return null;
  const lastT=parse(W[W.length-1].date).getTime();
  let P=W.filter(w=>lastT-parse(w.date).getTime()<=42*864e5);
  if(P.length<3)P=W.slice(-Math.min(W.length,5));
  if(P.length<2)return null;
  const xs=P.map(w=>(parse(w.date).getTime()-lastT)/864e5),ys=P.map(w=>w.kg);
  const n=xs.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;
  let sxx=0,sxy=0;xs.forEach((x,i)=>{sxx+=(x-mx)**2;sxy+=(x-mx)*(ys[i]-my);});
  if(!sxx)return null;
  const slope=sxy/sxx,b=my-slope*mx; // kg per day, value at last measurement date = b
  return {slope,lastT,at:t=>b+slope*(t-lastT)/864e5,days:Math.round(-Math.min(...xs)),n};
}
let year=new Date().getFullYear();
let weekStart=mondayOf(new Date());

// A hand-drawn looking cross, slightly different per day (seeded by the date), larger than its box.
function hashStr(k){let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))|0;return h;}
function crossSVG(k){
  const h=hashStr(k),j=n=>((h>>(n*3))&7)-3.5; // -3.5..3.5
  const r=((h>>2)%9)-4;                          // rotation -4..4 deg
  return `<svg class="xm${k===lastToggled?' new':''}" viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(${r} 50 50)">`
    +`<path d="M${18+j(1)} ${20+j(2)} Q${50+j(3)} ${47+j(4)} ${82+j(5)} ${80+j(6)}"/>`
    +`<path d="M${81+j(7)} ${19+j(8)} Q${52+j(9)} ${51+j(1)} ${19+j(2)} ${83+j(3)}"/></g></svg>`;
}
let lastToggled=null;
function toggle(d){const a=ACTION;lastToggled=d;setTimeout(()=>{lastToggled=null;},600);
  const has=S.actions.some(x=>x.date===d&&x.action===a);
  if(has)S.actions=S.actions.filter(x=>!(x.date===d&&x.action===a));else S.actions.push({date:d,action:a});
  save({type:'action',date:d,action:a,done:!has});
}

// ---------- render ----------
function render(){
  const st=S.settings;
  if(!st.goalStart&&(Number(st.targetKg)||st.deadline)){saveSettings({goalStart:todayIso});return;}
  const tw=Number(st.targetKg);
  const Wn=[...S.weight].sort((a,b)=>a.date.localeCompare(b.date));
  if(tw){$('goalView').textContent=fmtKg(tw)+' kg';
    $('goalSub').textContent=Wn.length?('Target weight · '+fmtKg(Math.abs(Wn[Wn.length-1].kg-tw))+' kg to go'):'Target weight';}
  else{$('goalView').textContent='–';$('goalSub').innerHTML='<span class="empty">Set your target weight</span>';}
  if(st.deadline){
    const days=Math.round((parse(st.deadline)-parse(todayIso))/864e5);
    $('dlCount').textContent=days>=0?days+(days===1?' day':' days'):'Passed';
    $('dlDate').textContent=fmtD(st.deadline)+(days>=0?' · '+Math.ceil(days/7)+' weeks':'');
  }else{$('dlCount').textContent='–';$('dlDate').innerHTML='<span class="empty">When?</span>';}
  const pw=perWeek();
  $('planView').textContent=pw?pw+'× / week':'–';
  $('planSub').innerHTML=pw?'Training days per week':'<span class="empty">How many days per week?</span>';
  fillPeriod();renderProcess();renderWeek();renderWeight();renderActions();renderMonth();
}

function renderProcess(){
  const st=S.settings,pw=perWeek(),T=trained();
  const mon=iso(mondayOf(new Date()));
  const wk=[...Array(7)].map((_,i)=>{const d=parse(mon);d.setDate(d.getDate()+i);return iso(d);});
  const doneWk=wk.filter(k=>T.has(k)).length;
  const days=st.deadline?Math.round((parse(st.deadline)-parse(todayIso))/864e5):null;
  const steps=[
    {t:'Goal',ok:!!Number(st.targetKg),v:Number(st.targetKg)?fmtKg(Number(st.targetKg))+' kg':'Set target weight',go:'goal'},
    {t:'Deadline',ok:!!st.deadline,v:st.deadline?(days>=0?days+' days left':'Passed'):'Pick a date',go:'deadline'},
    {t:'Plan',ok:!!pw,v:pw?pw+' days / week':'Days per week',go:'plan'},
    {t:'Action',ok:false,v:doneWk+(pw?' of '+pw:'')+' days',go:'week'},
  ];
  const firstOpen=steps.findIndex(x=>!x.ok);
  $('steps').innerHTML=`<div class="fill" style="width:${Math.max(0,(Math.max(0,(firstOpen<0?4:firstOpen))-1))/3*75}%"></div>`+steps.map((x,i)=>
    `<div class="st${x.ok?' ok':''}${i===firstOpen?' now':''}" data-go="${x.go}"><div class="n">${x.ok?'✓':i+1}</div><div class="t">${x.t}</div><div class="v" title="${esc(x.v)}">${esc(x.v)}</div></div>`).join('');
  // progress bars: time and weight
  const W=[...S.weight].sort((a,b)=>a.date.localeCompare(b.date));
  let bars='';
  if(st.deadline){
    const start=goalStart();
    const tot=Math.max(1,(parse(st.deadline)-parse(start))/864e5),el=Math.min(tot,Math.max(0,(parse(todayIso)-parse(start))/864e5));
    const p=Math.round(el/tot*100);
    bars+=`<div class="bar"><div class="top"><span>Time</span><b>${p}% elapsed</b></div><div class="track"><i style="width:${p}%;background:var(--muted)"></i></div><div class="ends"><span>${fmtDs(start)}</span><span>${fmtD(st.deadline)}</span></div></div>`;
  }
  const tw=Number(st.targetKg);
  if(tw&&W.length){
    const s0=startWeight(W).kg,cur=W[W.length-1].kg,tot=s0-tw;
    const p=tot?Math.round(Math.min(1,Math.max(0,(s0-cur)/tot))*100):100;
    bars+=`<div class="bar"><div class="top"><span>Weight</span><b>${p}% of the way</b></div><div class="track"><i style="width:${p}%;background:var(--accent)"></i></div><div class="ends"><span>${fmtKg(s0)} kg</span><span>${fmtKg(cur)} kg now</span><span>${fmtKg(tw)} kg</span></div></div>`;
  }
  $('bars').innerHTML=bars;$('bars').style.display=bars?'':'none';
}
function renderMonth(){
  const monthCur=new Date(weekStart.getFullYear(),weekStart.getMonth(),1);
  const T=trained(),y=monthCur.getFullYear(),mo=monthCur.getMonth();
  $('mLbl').textContent=monthCur.toLocaleDateString(LOC,{month:'long',year:'numeric'});
  const first=new Date(y,mo,1),n=new Date(y,mo+1,0).getDate(),lead=(first.getDay()+6)%7;
  let h=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dn">${d}</div>`).join('');
  for(let i=0;i<lead;i++)h+='<div class="blank"></div>';
  let c=0;
  for(let d=1;d<=n;d++){const k=iso(new Date(y,mo,d)),on=T.has(k);if(on)c++;
    h+=`<button class="day${on?' on':''}${k===todayIso?' today':''}${k>todayIso?' fut':''}" data-wd="${k}" title="${fmtD(k)}" aria-pressed="${on}">${d}${on?crossSVG(k):''}</button>`;}
  h+=`<div class="msum"><b>${c}</b> training ${c===1?'day':'days'} this month</div>`;
  $('month').innerHTML=h;
}
function renderWeek(){
  const days=[...Array(7)].map((_,i)=>{const d=new Date(weekStart);d.setDate(d.getDate()+i);return iso(d);});
  const end=days[6];
  const isThis=iso(mondayOf(new Date()))===days[0];
  const T=trained(),pw=perWeek();
  let h='<div class="week">';
  days.forEach(k=>{const d=parse(k);h+=`<div class="hd${k===todayIso?' today':''}">${d.toLocaleDateString(LOC,{weekday:'short'})}<small>${d.getDate()}</small></div>`;});
  h+='<div class="hd">Total</div>';
  let n=0;
  days.forEach(k=>{const on=T.has(k);if(on)n++;
    h+=`<button class="chk${on?' on':''}${k===todayIso?' today':''}${k>todayIso?' fut':''}" data-wd="${k}" title="${fmtD(k)}" aria-pressed="${on}">${on?crossSVG(k):''}</button>`;});
  h+=`<div class="tot${pw&&n>=pw?' hit':''}">${n}/${pw||7}</div>`;
  $('week').innerHTML=h+'</div>';
}

function renderWeight(){
  const W=[...S.weight].sort((a,b)=>a.date.localeCompare(b.date));
  const tw=Number(S.settings.targetKg)||null, dl=S.settings.deadline||null;
  let h='';
  if(W.length){
    const sw=startWeight(W),first=sw.kg,last=W[W.length-1].kg,diff=last-first;
    const toward=d=>tw?(Math.sign(tw-first)===Math.sign(d)||d===0):d<=0;
    h+=`<div class="stat"><div class="v">${fmtKg(last)} kg</div><div class="l">Current</div></div>`;
    if(tw){const tot=first-tw,p=tot?Math.round(Math.min(1,Math.max(0,(first-last)/tot))*100):100;
      h+=`<div class="stat"><div class="v">${p}%</div><div class="l">To goal (${fmtKg(tw)} kg)</div></div>`;}
  }else h='<div class="sub">No measurements yet. Add your first weight below.</div>';
  $('wStats').innerHTML=h;
  $('wList').innerHTML=[...W].reverse().map(w=>`<div><span>${fmtD(w.date)}</span><span><b>${fmtKg(w.kg)} kg</b> <button title="Delete" data-del="${w.date}">✕</button></span></div>`).join('');
  drawChart(W,tw,dl);
}

// Chart zoom: how far back the chart shows (0 = everything)
const ZOOMS=[['All',0],['1 year',365],['6 months',182],['3 months',91],['1 month',30]];
let zoomI=(()=>{try{const v=+localStorage.getItem('training.zoom');return v>=0&&v<ZOOMS.length?v:0}catch(e){return 0}})();
function drawChart(W,tw,dl){
  const wrap=$('chartWrap');wrap.querySelector('svg')?.remove();$('tip').style.display='none';
  if(!W.length)return;
  const width=Math.max(200,wrap.clientWidth),height=width<420?200:240,m={l:34,r:8,t:12,b:26};
  const tr=trend(W);
  const ref=Math.max(parse(W[W.length-1].date).getTime(),parse(todayIso).getTime());
  const t0=ZOOMS[zoomI][1]?Math.max(parse(W[0].date).getTime(),ref-ZOOMS[zoomI][1]*864e5):parse(W[0].date).getTime();
  // y-range follows what is visible (plus the point just before the window, for a continuous line)
  const firstVis=Math.max(0,W.findIndex(w=>parse(w.date).getTime()>=t0)-1);
  const Wv=W.slice(firstVis);
  let t1=Math.max(parse(W[W.length-1].date).getTime(),parse(todayIso).getTime());
  if(dl)t1=Math.max(t1,parse(dl).getTime());
  if(t1-t0<7*864e5)t1=t0+7*864e5;
  const tf=dl?parse(dl).getTime():null; // forecast runs to the deadline
  const vals=Wv.map(w=>w.kg);if(tw)vals.push(tw);if(tr&&tf)vals.push(tr.at(tf));
  let lo=Math.min(...vals),hi=Math.max(...vals);const padv=Math.max(1,(hi-lo)*.15);lo=Math.floor(lo-padv);hi=Math.ceil(hi+padv);
  const x=t=>m.l+(t-t0)/(t1-t0)*(width-m.l-m.r), y=v=>m.t+(hi-v)/(hi-lo)*(height-m.t-m.b);
  let s=`<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><defs><clipPath id="plotClip"><rect x="${m.l}" y="0" width="${width-m.l}" height="${height-m.b}"/></clipPath></defs>`;
  const step=Math.max(1,Math.ceil((hi-lo)/4));
  for(let v=Math.ceil(lo);v<=hi;v+=step){s+=`<line x1="${m.l}" x2="${width-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`;}
  const d=new Date(t0);d.setDate(1);d.setMonth(d.getMonth()+1);
  const months=[];while(d.getTime()<=t1){months.push(new Date(d));d.setMonth(d.getMonth()+1);}
  const every=Math.ceil(months.length/8)||1;
  months.forEach((md,i)=>{if(i%every)return;s+=`<text x="${x(md.getTime())}" y="${height-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${md.toLocaleDateString(LOC,{month:'short'})}${md.getMonth()===0?" '"+String(md.getFullYear()).slice(2):''}</text>`;});
  if(tw)s+=`<line x1="${m.l}" x2="${width-m.r}" y1="${y(tw)}" y2="${y(tw)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  const sw=startWeight(W),gs=parse(goalStart()).getTime();
  if(tw&&dl&&sw)s+=`<line x1="${x(Math.max(t0,gs))}" y1="${y(sw.kg)}" x2="${x(parse(dl).getTime())}" y2="${y(tw)}" stroke="var(--muted2)" stroke-width="1.5" stroke-dasharray="2 4"/>`;
  // forecast: trend line from the last measurement to the deadline
  if(tr&&tf&&tf>tr.lastT){const fx=x(tf),fy=y(tr.at(tf));
    s+=`<line x1="${x(tr.lastT)}" y1="${y(tr.at(tr.lastT))}" x2="${fx}" y2="${fy}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5" opacity=".55"/>`
     +`<circle cx="${fx}" cy="${fy}" r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2" stroke-dasharray="2 2"/>`
     +`<text x="${fx-8}" y="${fy+16}" text-anchor="end" font-size="10" font-weight="700" fill="var(--text)">${fmtKg(tr.at(tf))} kg forecast</text>`;}
  const tt=parse(todayIso).getTime();
  s+=`<line x1="${x(tt)}" x2="${x(tt)}" y1="${m.t}" y2="${height-m.b}" stroke="var(--muted2)" stroke-width="1"/>`;
  if(dl)s+=`<line x1="${x(parse(dl).getTime())}" x2="${x(parse(dl).getTime())}" y1="${m.t}" y2="${height-m.b}" stroke="var(--bad)" stroke-width="1" stroke-dasharray="3 3"/><text x="${x(parse(dl).getTime())-4}" y="${m.t+10}" text-anchor="end" font-size="10" font-weight="600" fill="var(--bad)">deadline</text>`;
  const pts=W.map(w=>[x(parse(w.date).getTime()),y(w.kg)]);
  s+='<g clip-path="url(#plotClip)">';
  s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  // highest weight gets its own marker (a star)
  let hiI=0;W.forEach((w,i)=>{if(w.kg>W[hiI].kg)hiI=i;});
  W.forEach((w,i)=>{if(i!==hiI)s+=`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="${W.length>60?2.5:4}" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`;});
  const [hx,hy]=pts[hiI],star=[...Array(10)].map((_,k)=>{const r=k%2?3.4:8,a=Math.PI/5*k-Math.PI/2;return (hx+r*Math.cos(a)).toFixed(1)+','+(hy+r*Math.sin(a)).toFixed(1);}).join(' ');
  s+=`<polygon points="${star}" fill="var(--text)" stroke="var(--surface)" stroke-width="1.2"/><text x="${hx-11}" y="${hy-6}" text-anchor="end" font-size="10" font-weight="700" fill="var(--text)">${fmtKg(W[hiI].kg)} kg</text>`;
  s+='</g></svg>';
  wrap.insertAdjacentHTML('afterbegin',s);
  const svg=wrap.querySelector('svg'),tip=$('tip');
  svg.addEventListener('mousemove',ev=>{const r=svg.getBoundingClientRect(),mx=ev.clientX-r.left;let bi=0,bd=1e9;pts.forEach((p,i)=>{const dd=Math.abs(p[0]-mx);if(dd<bd){bd=dd;bi=i}});
    if(bd>40||pts[bi][0]<m.l){tip.style.display='none';return;}tip.style.display='block';tip.style.left=pts[bi][0]+'px';tip.style.top=pts[bi][1]+'px';tip.textContent=fmtD(W[bi].date)+' · '+fmtKg(W[bi].kg)+' kg';});
  svg.addEventListener('mouseleave',()=>tip.style.display='none');
}

function renderActions(){
  const T=trained(),pw=perWeek();
  const jan1=new Date(year,0,1),dec31=new Date(year,11,31);
  const start=mondayOf(jan1);
  const cs=12,gap=3,left=3,top=22;
  let cells='',xs='',col=0,cnt=0,lastMonth=-1,labels='';
  for(let d=new Date(start);d<=dec31;d.setDate(d.getDate()+1)){
    const row=(d.getDay()+6)%7;if(row===0&&d>start)col++;
    if(d<jan1)continue;
    const k=iso(d),isDone=T.has(k),fut=k>todayIso,isT=k===todayIso;
    if(isDone)cnt++;
    if(d.getMonth()!==lastMonth&&(d.getDate()===1&&lastMonth<0||row===0&&d.getDate()<=7)){lastMonth=d.getMonth();labels+=`<text x="${left+col*(cs+gap)}" y="12" font-size="12" font-weight="600" fill="var(--muted)">${d.toLocaleDateString(LOC,{month:'short'})}</text>`;}
    const cx0=left+col*(cs+gap),cy0=top+row*(cs+gap);
    cells+=`<rect class="c" data-d="${k}" x="${cx0}" y="${cy0}" width="${cs}" height="${cs}" rx="3" fill="var(--cell)" ${fut?'opacity=".45"':''} ${isT?'stroke="var(--cell-today)" stroke-width="1.5"':''}><title>${fmtD(k)}${isDone?' · trained':''}</title></rect>`;
    if(isDone){const hh=hashStr(k),o=((hh>>4)&3)-1.5;
      xs+=`<path class="yx" d="M${cx0-2.5+o} ${cy0-2} L${cx0+cs+2.5} ${cy0+cs+2+o*.5} M${cx0+cs+2} ${cy0-2.5+o*.5} L${cx0-2} ${cy0+cs+2.5}"/>`;}
  }
  const dl=['Mon','','Wed','','Fri','','Sun'].map((t,i)=>t?`<text x="0" y="${top+i*(cs+gap)+11}" font-size="11" fill="var(--muted)">${t}</text>`:'').join('');
  const w=left+(col+1)*(cs+gap),h=top+7*(cs+gap);
  // weeks on plan: finished weeks of this year since the first training day, plus this week once it already hits the plan
  const first=[...T].filter(k=>k.startsWith(year+'-')).sort()[0];
  let wTot=0,wHit=0,wStreak=0,run=0;
  if(first){
    const thisMon=iso(mondayOf(new Date()));
    for(let m=mondayOf(parse(first));iso(m)<=thisMon&&m<=dec31;m.setDate(m.getDate()+7)){
      let n=0;for(let i=0;i<7;i++){const d=new Date(m);d.setDate(d.getDate()+i);if(T.has(iso(d)))n++;}
      const current=iso(m)===thisMon,hit=pw&&n>=pw;
      if(current&&!hit)continue;
      wTot++;if(hit){wHit++;run++;}else run=0;
    }
    wStreak=run;
  }
  // ---- year goal: plan (days/week) x weeks from Jan 1 (or the goal start, if later) to Dec 31
  const yStart=[iso(jan1),goalStart()].sort()[1]>iso(dec31)?null:[iso(jan1),goalStart()].sort()[1];
  const span=k=>(parse(k)-parse(yStart))/864e5+1; // days since yStart, inclusive
  const yGoal=pw&&yStart?Math.round(pw*span(iso(dec31))/7):0;
  const expected=pw&&yStart&&todayIso>=yStart?Math.min(yGoal,Math.round(pw*span(todayIso<=iso(dec31)?todayIso:iso(dec31))/7)):0;
  const gp=yGoal?Math.min(100,Math.round(cnt/yGoal*100)):0, ep=yGoal?Math.min(100,Math.round(expected/yGoal*100)):0;
  const pace=cnt-expected;
  const paceTxt=expected?(pace===0?'on pace':Math.abs(pace)+' '+(Math.abs(pace)===1?'day':'days')+' '+(pace>0?'ahead':'behind')):'';
  $('actSum').innerHTML=`<div class="calsum"><span><b>${cnt}</b>${yGoal?' / '+yGoal:''} days in ${year}</span>${paceTxt?`<span>${paceTxt}</span>`:''}</div>
    ${yGoal?`<div class="track thin"><i style="width:${gp}%;background:var(--accent)"></i></div>`:''}`;
  $('actions').innerHTML=`<div class="heat"><svg viewBox="0 0 ${w+3} ${h+3}" preserveAspectRatio="xMinYMin meet">${labels}${cells}${xs}</svg></div>`;
}

// ---------- events ----------
document.addEventListener('click',e=>{
  const wc=e.target.closest('[data-wd]');
  if(wc){toggle(wc.dataset.wd);return;}
  const c=e.target.closest('rect.c');
  if(c){toggle(c.dataset.d);return;}
  const del=e.target.closest('[data-del]');
  if(del){const d=del.dataset.del,w=S.weight.find(x=>x.date===d);
    dialog(`<h3>Delete measurement?</h3><p>${fmtD(d)} · ${w?fmtKg(w.kg)+' kg':''}</p>`,()=>{S.weight=S.weight.filter(x=>x.date!==d);save({type:'weight',date:d,delete:true});},'Delete');return;}
  const go=e.target.closest('[data-go]');
  if(go){const g=go.dataset.go;if(g==='week')$('actionCard').scrollIntoView({behavior:'smooth',block:'center'});else openEdit(g);return;}
  const ed=e.target.closest('[data-edit]');
  if(ed)openEdit(ed.dataset.edit);
});
$('wDate').value=todayIso;
$('wAdd').onclick=()=>{const d=$('wDate').value,kg=parseFloat(String($('wKg').value).replace(',','.'));if(!d||!(kg>0))return;
  S.weight=S.weight.filter(w=>w.date!==d);S.weight.push({date:d,kg});$('wKg').value='';save({type:'weight',date:d,kg});};
$('wKg').addEventListener('keydown',e=>{if(e.key==='Enter')$('wAdd').click();});
// ---------- period menu (year + week) ----------
function fillPeriod(){
  const now=new Date().getFullYear();
  const ys=[...trained()].map(k=>+k.slice(0,4)).concat(S.weight.map(w=>+w.date.slice(0,4)),[now,now+1,year]);
  const y0=Math.min(...ys),y1=Math.max(...ys);
  $('selYear').innerHTML=[...Array(y1-y0+1)].map((_,i)=>y1-i).map(y=>`<option value="${y}"${y===year?' selected':''}>${y}</option>`).join('');
  // weeks whose Monday falls in the selected year (plus the week containing 1 Jan)
  const opts=[];const ws=iso(weekStart);
  for(let m=mondayOf(new Date(year,0,1));m.getFullYear()<=year;m.setDate(m.getDate()+7)){
    const e=new Date(m);e.setDate(e.getDate()+6);const k=iso(m);
    opts.push(`<option value="${k}"${k===ws?' selected':''}>W${isoWeek(m)} · ${fmtDs(k)} – ${fmtDs(iso(e))}${k===iso(mondayOf(new Date()))?' (now)':''}</option>`);
  }
  $('selWeek').innerHTML=opts.join('');
}
$('selYear').onchange=e=>{year=+e.target.value;
  const cur=mondayOf(new Date());
  weekStart=cur.getFullYear()===year?cur:mondayOf(new Date(year,0,1));
  fillPeriod();renderWeek();renderActions();renderMonth();};
$('selWeek').onchange=e=>{weekStart=parse(e.target.value);renderWeek();renderMonth();};
$('zoom').value=zoomI;$('zLbl').textContent=ZOOMS[zoomI][0];
$('zoom').oninput=e=>{zoomI=+e.target.value;$('zLbl').textContent=ZOOMS[zoomI][0];try{localStorage.setItem('training.zoom',zoomI)}catch(_){};renderWeight();};
$('wListToggle').onclick=()=>{const l=$('wList'),open=l.hidden;l.hidden=!open;$('wListToggle').textContent=open?'Measurements ▴':'Measurements ▾';};
let actView=(()=>{try{return localStorage.getItem('training.view')||'week'}catch(e){return 'week'}})();
function setView(v){actView=v;$('actionCard').dataset.view=v;document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));try{localStorage.setItem('training.view',v)}catch(e){}}
document.querySelectorAll('#viewSeg button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
setView(actView);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderWeight,150);});

// ---------- dialogs ----------
function dialog(html,onSave,okLabel){
  const f=$('dlgForm');f.innerHTML=html+`<div class="row" style="justify-content:flex-end;margin-top:18px"><button class="ghost" value="cancel">Cancel</button><button class="primary" value="ok">${okLabel||'Save'}</button></div>`;
  const dlg=$('dlg');dlg.returnValue='';dlg.showModal();
  dlg.onclose=()=>{if(dlg.returnValue==='ok')onSave(f);};
}
function openEdit(k){
  const st=S.settings;
  if(k==='goal')dialog(`<h3>Goal</h3><p>Your target weight.</p><label>Target weight (kg)</label><input name="targetKg" type="number" step="0.1" min="20" max="300" value="${esc(st.targetKg)}"><label>Goal start (progress is measured from this date)</label><input name="goalStart" type="date" value="${esc(goalStart())}">`,
    f=>saveSettings({targetKg:f.targetKg.value,goalStart:f.goalStart.value||todayIso}));
  if(k==='deadline')dialog(`<h3>Deadline</h3><p>When should you reach your target weight? Goal + deadline = your objective.</p><label>Date</label><input name="deadline" type="date" value="${esc(st.deadline)}">`,
    f=>saveSettings({deadline:f.deadline.value}));
  if(k==='plan')dialog(`<h3>Plan</h3><p>How many days per week will you train?</p><label>Training days per week</label><input name="daysPerWeek" type="number" min="1" max="7" step="1" value="${esc(st.daysPerWeek)}">`,
    f=>{const n=Math.min(7,Math.max(1,parseInt(f.daysPerWeek.value,10)||0));if(n)saveSettings({daysPerWeek:String(n)});});
}
$('btnSettings').onclick=()=>dialog(`<h3>Google Sheet connection</h3><p>Paste the Apps Script web app URL (ends in /exec) and the same key as SECRET in the script. Leave empty to store data in this browser only.</p>
  <label>Web app URL</label><input name="url" value="${esc(cfg.url)}" placeholder="https://script.google.com/macros/s/…/exec">
  <label>Key</label><input name="key" type="password" value="${esc(cfg.key)}">`,
  async f=>{const wasLocal=!remote();const local=ls.get(LS_DATA,null);cfg={url:f.url.value.trim(),key:f.key.value.trim()};ls.set(LS_CFG,cfg);
    await load();
    // first connection: copy local data into an empty sheet
    if(wasLocal&&remote()&&local&&!S.weight.length&&!S.actions.length&&!Object.keys(S.settings).length&&(local.weight.length||local.actions.length||Object.keys(local.settings).length)){
      if(confirm('The sheet is empty. Copy your local data to the sheet?')){
        await save({type:'settings',settings:local.settings});
        for(const w of local.weight)await save({type:'weight',date:w.date,kg:w.kg});
        for(const a of local.actions)await save({type:'action',date:a.date,action:a.action,done:true});
      }
    }
  });

load();
// first visit on a device (or a wrong key): ask only for the key
function askKey(){if($('dlg').open)return;dialog(`<h3>Connect</h3><p>Enter your key once on this device to load your data.</p><label>Key</label><input name="key" type="password" autocomplete="current-password">`,
  async f=>{const k=f.key.value.trim();if(!k)return;cfg={url:DEFAULT_URL,key:k};ls.set(LS_CFG,cfg);await load();});}
if(!cfg.key)setTimeout(askKey,300);
</script>
