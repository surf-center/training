  if(k==='deadline')dialog(`<h3>Deadline</h3><p>When should you reach your target weight? Goal + deadline = your objective.</p><label>Date</label><input name="deadline" type="date" value="${esc(st.deadline)}">`,
    f=>saveSettings({deadline:f.deadline.value}));
  if(k==='plan')dialog(`<h3>Plan</h3><p>How many days per week will you train?</p><label>Training days per week</label><input name="daysPerWeek" type="number" min="1" max="7" step="1" value="${esc(st.daysPerWeek)}">`,
    f=>{const n=Math.min(7,Math.max(1,parseInt(f.daysPerWeek.value,10)||0));if(n)saveSettings({daysPerWeek:String(n)});});
}
load().then(()=>playIntro());
// ---------- intro: a short motivational run-through, once a day ----------
let introRun=0;
function playIntro(force){
  if(!force){try{if(localStorage.getItem('training.intro')===todayIso)return;}catch(e){}
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;}
  // The method, built up line by line: Goal + Deadline = Objective, + Plan = Strategy, + Consistent action = Results
  const today=(totalScore(scoresAt('day',todayIso))||0)>=80; // 'Done today' once the whole day scores 80+
  const X='<span class="in-x"><svg viewBox="0 0 100 100"><path d="M22 23 Q50 48 78 77"/><path d="M78 22 Q52 51 22 78"/></svg></span>';
  const run=++introRun;
  const stage=$('inStage'),el=$('intro');$('inDots').innerHTML='';
  // Kinetic type: each word lands big in the centre, then tucks into a small list at the top.
  // Finale: TAKE ACTION. with a big hand-drawn cross stamped over it.
  // The formula: Goal + Deadline = Objective, + Plan = Strategy, + Consistent action = Results
  // Calm build-up: one stable board, one line at a time; each outcome lands after its term.
  // [term, outcome sentence, negative, formula pieces this line adds at the top]
  const rows=[
    ['Goal without deadline','Only a dream.',true,[]],
    ['Goal <i>+</i> deadline','You have an objective.',false,['Goal','Deadline']],
    ['Goal <i>+</i> deadline <i>+</i> plan','You have a strategy.',false,['Plan']],
    ['Goal <i>+</i> deadline <i>+</i> plan <i>+</i> <span class="k6-u">consistency in action</span>','You get results.',false,['Consistency in action']]];
  stage.innerHTML=`<div class="k5">
    <div class="k6-top">${rows.flatMap(r=>r[3]).map((w,n)=>`<span>${n?'<i>+</i>':''}${w}</span>`).join('')}</div>
    <div class="k6">${rows.map(([t,o,neg])=>`<div class="k6-row${neg?' neg':''}"><div class="k6-t">${t}</div><div class="k6-o">${o}</div></div>`).join('')}</div>
    <div class="k5-stage"><div class="k5-end"><div class="k5-cta">${today?'Done<br>today.':'Take<br>action.'}</div>
        <svg class="k5-x" viewBox="0 0 100 100"><path d="M14 16 Q50 46 86 84"/><path d="M85 14 Q53 51 15 87"/></svg></div>
    </div></div>`;
  el.hidden=false;
  const R=[...stage.querySelectorAll('.k6-row')],E=stage.querySelector('.k5-end'),K=stage.querySelector('.k5'),B=stage.querySelector('.k6'),TOP=[...stage.querySelectorAll('.k6-top span')];
  let topN=0;const addTop=n=>{for(let k=0;k<rows[n][3].length;k++)TOP[topN++].classList.add('on');};
  const parts=[];const step=(fx,gap)=>parts.push({fx,gap});
  R.forEach((r,n)=>{
    step(()=>{R.forEach((x,k)=>x.classList.toggle('past',k<n));r.classList.add('in');},680);   // term
    step(()=>{r.classList.add('eq');addTop(n);},n===0?1350:1300);                          // outcome + formula grows at the top
    if(n===0)step(()=>r.classList.add('gone'),450);                                          // fantasy fades out of the way
  });
  step(()=>B.classList.add('out'),600);
  step(()=>E.classList.add('in'),700);
  step(()=>{E.classList.add('stamp');K.classList.add('shake');},1700);
  const gaps=parts.map(p=>p.gap);let i=0,timer;const total=gaps.reduce((a,b)=>a+b,0)+1700;
  // pausable timeline: hold the screen to pause, release to continue
  const bar=$('inBar');let fn=null,due=0,left=0,paused=false,barLeft=total,barT0=0,done=false;
  const sched=(f,ms)=>{fn=f;left=ms;due=performance.now()+ms;timer=setTimeout(()=>{fn=null;f();},ms);};
  const runBar=()=>{barT0=performance.now();bar.style.transition=`width ${barLeft}ms linear`;bar.style.width='100%';};
  bar.style.transition='none';bar.style.width='0';requestAnimationFrame(runBar);
  const end=()=>{if(done)return;done=true;clearTimeout(timer);el.classList.remove('paused');el.classList.add('out');setTimeout(()=>{el.hidden=true;el.classList.remove('out');},450);try{localStorage.setItem('training.intro',todayIso)}catch(e){}};
  const next=()=>{if(i>=parts.length){sched(end,1800);return;}const p=parts[i++];p.fx();sched(next,p.gap||300);};
  const pause=()=>{if(paused||done)return;paused=true;clearTimeout(timer);left=Math.max(0,due-performance.now());
    const w=getComputedStyle(bar).width;bar.style.transition='none';bar.style.width=w;barLeft=Math.max(0,barLeft-(performance.now()-barT0));el.classList.add('paused');};
  const resume=()=>{if(!paused||done)return;paused=false;el.classList.remove('paused');if(fn){const f=fn;due=performance.now()+left;timer=setTimeout(()=>{fn=null;f();},left);}runBar();};
  // pause/play button + hold-to-pause anywhere else
  const PI='<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>',PL='<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',pp=$('inPause');
  const setPP=()=>{pp.innerHTML=paused?PL:PI;pp.setAttribute('aria-label',paused?'Play':'Pause');};
  let held=false;setPP();
  pp.onclick=e=>{e.stopPropagation();paused?resume():pause();setPP();};
  $('inSkip').onclick=e=>{e.stopPropagation();end();};
  el.onpointerdown=e=>{if(e.target.closest('#inSkip,#inPause')||paused)return;held=true;pause();setPP();};
  el.onpointerup=el.onpointercancel=el.onpointerleave=()=>{if(held){held=false;resume();setPP();}};
  el.onclick=null;el.oncontextmenu=e=>e.preventDefault();
  sched(next,250);
  // safety: never block the dashboard (only counts time while not paused)
  const guard=setInterval(()=>{if(run!==introRun||done){clearInterval(guard);return;}if(!paused&&performance.now()>due+3000)end();},1000);
}
// log in once per device: name + password from the sheet's Users tab -> token kept on this device
function askLogin(msg){const dlg=$('dlg'),f=$('dlgForm');if(dlg.open)return;
  // own login form: Enter logs in (the generic dialog would treat Enter as Cancel), stays open while logging in
  f.innerHTML=`<h3>Log in</h3><p>Once per device. You stay logged in after that.</p>
    <label>Name</label><input name="name" maxlength="30" autocomplete="username" autocapitalize="words" autocorrect="off" spellcheck="false" value="${auth?auth.name:(ls.get('training.lastName','')||'')}">
    <label>Password</label><input name="pw" type="password" maxlength="40" autocomplete="current-password">
    <p class="lerr" style="color:var(--warn);font-weight:600;min-height:1.2em;margin:10px 0 0">${msg||''}</p>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="primary" type="submit" style="min-width:110px">Log in</button></div>`;
  const btn=f.querySelector('button'),err=f.querySelector('.lerr');
  f.onsubmit=async e=>{e.preventDefault();const name=f.name.value.trim(),pw=f.pw.value.trim();
    if(!name||!pw){err.textContent='Fill in both fields';return;}
    btn.disabled=true;btn.textContent='Logging in…';err.textContent='';setSync('busy','Logging in…');
    try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'login',name,password:pw})});
      const j=await r.json();if(!j.ok)throw new Error(j.error||'Error');
      auth={name:j.user,token:j.token};ls.set(LS_AUTH,auth);ls.set('training.lastName',j.user);
      f.onsubmit=null;dlg.close();setData(j);showWho();setSync('ok','Connected to Google');render();
    }catch(e2){err.textContent=/fetch|network|load failed/i.test(e2.message)?'No connection, try again':e2.message;
      btn.disabled=false;btn.textContent='Log in';setSync('err','Not logged in');f.pw.select();}};
  dlg.onclose=()=>{f.onsubmit=null;};
  dlg.returnValue='';dlg.showModal();setTimeout(()=>(f.name.value?f.pw:f.name).focus(),50);}
$('who').onclick=()=>{if(!auth)return askLogin();
  dialog(`<h3>${auth.name}</h3><p>Logged in on this device. Log out to switch to another person.</p>`,()=>{logout();askLogin();},'Log out');};
// old single-PIN setup: clean up
try{localStorage.removeItem('training.cfg');localStorage.removeItem('training.data')}catch(e){}
</script>
