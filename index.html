<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Health</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f5f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Health">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f8;--surface:#fff;--surface2:#f1f3f7;--border:#e3e6ec;
  --text:#0f172a;--text2:#334155;--muted:#64748b;--muted2:#94a3b8;
  --accent:#2563eb;--accent-soft:#dbeafe;--good:#059669;--good-soft:#d1fae5;--warn:#d97706;--bad:#dc2626;
  --cell:#e8ebf0;--cell-done:#2563eb;--cell-today:#0f172a;
  --font:'Poppins',system-ui,-apple-system,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0b0f17;--surface:#131a26;--surface2:#1a2332;--border:#253044;
  --text:#e8edf5;--text2:#c3ccda;--muted:#8a96a8;--muted2:#5d6a7d;
  --accent:#60a5fa;--accent-soft:#1e3a5f;--good:#34d399;--good-soft:#064e3b;
  --cell:#1f2a3b;--cell-done:#60a5fa;--cell-today:#e8edf5;
}
:root[data-theme="dark"] .card{box-shadow:none;border:1px solid var(--border)}
/* dark: ticked Nutrition boxes soft blue with a check, open ones quiet grey */
:root[data-theme="dark"] .pill{background:var(--surface2);color:var(--muted)}:root[data-theme="dark"] .pill.on{background:var(--accent-soft);color:var(--accent)}:root[data-theme="dark"] .pill.on span::before{content:"✓";margin-right:7px}
:root[data-theme="dark"]{color-scheme:dark}
.themebtn{border:none;background:var(--surface);color:var(--text2);width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.06);flex:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{accent-color:#2563eb;color-scheme:light}
::selection{background:var(--accent-soft);color:var(--text)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 16px calc(60px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.3px}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted2)}
.dot.ok{background:var(--good)}.dot.busy{background:var(--warn)}.dot.err{background:var(--bad)}
.hdr-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.period{display:flex;gap:6px}
.period select{width:auto;font-size:12px;font-weight:600;padding:7px 8px;border-radius:10px;background:var(--surface);cursor:pointer}
.iconbtn{border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.label{flex-wrap:wrap;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.edit{font-size:11px;font-weight:600;color:var(--accent);background:none;border:none;cursor:pointer;padding:0;text-transform:none;letter-spacing:0;font-family:var(--font)}
.stack{position:relative;margin-bottom:34px;cursor:pointer}
.stack .scard{margin:0;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
.stack .scard+.scard{margin-top:12px}
.stack[aria-expanded="false"] .scard:nth-child(2),.stack[aria-expanded="false"] .scard:nth-child(3),.stack[aria-expanded="false"] .scard:nth-child(4){position:absolute;left:0;right:0;top:0;height:100%;margin:0;overflow:hidden;pointer-events:none}
.stack[aria-expanded="false"] .scard:nth-child(2){transform:translateY(12px) scale(.95);z-index:1;opacity:.85}
.stack[aria-expanded="false"] .scard:nth-child(3){transform:translateY(23px) scale(.9);z-index:0;opacity:.6}
.stack[aria-expanded="false"] .scard:nth-child(4){transform:translateY(23px) scale(.9);z-index:0;opacity:0}
.stack[aria-expanded="false"] .scard:nth-child(n+5){position:absolute;left:0;right:0;top:0;height:100%;opacity:0;pointer-events:none;overflow:hidden}
.stack[aria-expanded="false"] .scard:nth-child(2)>*,.stack[aria-expanded="false"] .scard:nth-child(3)>*,.stack[aria-expanded="false"] .scard:nth-child(4)>*{visibility:hidden}
.stack .scard:first-child{position:relative;z-index:2}
.stack[aria-expanded="true"]{margin-bottom:16px}
.more-n{margin-left:auto;margin-right:10px;font-size:11px;font-weight:800;color:var(--muted);background:var(--surface2);border-radius:20px;padding:2px 8px;letter-spacing:0}
.stack[aria-expanded="true"] .more-n{display:none}
.stack-less{display:none;margin:10px auto 0;border:none;background:none;font-family:var(--font);font-size:12px;font-weight:800;color:var(--muted);cursor:pointer}
.stack[aria-expanded="true"] .stack-less{display:block}
.wform{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:8px;margin-top:16px}
.wform input{min-width:0;width:100%;box-sizing:border-box}
.wkf{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
.wform input[type=date],.wform input[type=time]{-webkit-appearance:none;appearance:none;text-align:left}
@media (max-width:560px){.wform{grid-template-columns:minmax(0,1fr) 104px}.wform input{font-size:15px;padding:0 12px}}
.wform input,.wform button{height:44px;margin:0;border-radius:12px}
.wform input{font-size:15px;font-weight:700;padding:0 12px}
.wform button.primary{padding:0 20px;font-size:14px}
.wtable td.kg i.chg{display:block;font-style:normal;font-size:12px;font-weight:800;margin-top:2px}
.wtable .dt i.tm{font-style:normal;color:var(--muted);font-weight:600;margin-left:4px}
.linkbtn{display:block;width:100%;margin-top:10px;border:none;background:none;font-family:var(--font);font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;padding:6px}
.wtable{margin-top:4px;max-height:280px;overflow:auto;border-radius:12px;background:var(--surface2)}
.wtable table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.wtable th{position:sticky;top:0;background:var(--surface2);text-align:left;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:9px 12px}
.wtable td{padding:9px 12px;border-top:1px solid var(--border);font-weight:600}
.wtable td.kg{font-size:18px;font-weight:900;letter-spacing:-.3px}
.wtable td.chg{font-size:15px;font-weight:800}
.wtable td.dt{font-size:12px;font-weight:600;color:var(--muted);text-align:right}
.wtable th:nth-child(2){text-align:right}
.wtable .up{color:var(--good)}.wtable .dn{color:var(--accent)}.wtable .nc{color:var(--muted)}
.wtable th:last-child,.wtable td:last-child{text-align:right;width:36px}
.wtable button{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;display:inline-flex;border-radius:8px}
.wtable button:hover{color:var(--bad);background:var(--surface)}
.grid3{display:grid;grid-template-columns:1.3fr .8fr 1.3fr;gap:16px;margin-bottom:16px}
.grid3 .card{margin:0}
.big{font-size:17px;font-weight:700;margin-top:8px;white-space:pre-wrap}
.text{font-size:13px;color:var(--text2);margin-top:8px;white-space:pre-wrap}
.empty{color:var(--muted2);font-style:italic;font-weight:400}
.countdown{font-size:28px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--muted)}
.step{display:inline-block;font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-right:6px}
input,textarea,select{font-family:var(--font);font-size:13px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:8px 10px;width:100%}
textarea{min-height:90px;resize:vertical}
button.primary{font-family:var(--font);font-size:13px;font-weight:600;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:8px 14px;cursor:pointer;white-space:nowrap}
button.ghost{font-family:var(--font);font-size:13px;font-weight:600;background:none;color:var(--muted);border:1px solid var(--border);border-radius:9px;padding:8px 14px;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:12px 0 4px}
.stat .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.chartwrap{position:relative;margin-top:10px;overflow:hidden}
.chartwrap svg{display:block;max-width:100%}
svg text{font-family:var(--font)}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);font-size:11px;font-weight:600;padding:5px 8px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-120%);display:none}
.wlist{margin-top:12px;max-height:150px;overflow:auto;font-size:12px;border-top:1px solid var(--border)}
.wlist div{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px solid var(--border);color:var(--text2)}
.wlist button{background:none;border:none;color:var(--muted2);cursor:pointer;font-size:13px}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.navbar{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0}
.navbar button{border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:8px;width:28px;height:28px;cursor:pointer}
.navbar b{font-size:13px;color:var(--text);text-align:center;font-weight:700}
/* this week */
.week{display:grid;grid-template-columns:repeat(7,minmax(32px,1fr)) 56px;gap:6px;align-items:center;margin-top:14px}
.week .hd{font-size:10px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.4px;line-height:1.25}
.week .hd small{display:block;font-weight:500;font-size:10px;text-transform:none;letter-spacing:0;color:var(--muted2)}
.week .hd.today{color:var(--accent)}.week .hd.today small{color:var(--accent)}
.week .tot{font-size:12px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.chk{height:40px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:transparent;transition:background .12s,border-color .12s}
.chk:hover{border-color:var(--cell-done)}
.chk.on{background:var(--cell-done);border-color:var(--cell-done);color:#fff}
.chk.today{border-color:var(--text)}
.chk.on.today{border-color:var(--cell-done);box-shadow:0 0 0 2px var(--text)}
.chk.fut{opacity:.55}
.action{margin-top:16px}
.ahead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ahead .name{font-weight:700;font-size:14px}
.ahead .meta{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ahead .meta b{color:var(--text)}
.heat{margin-top:6px}
.more{display:block;margin:14px auto 0;font-size:12px;padding:6px 14px}
.mhead{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 10px}
.mhead button{border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:8px;width:30px;height:30px;cursor:pointer}
.mhead b{font-size:15px;min-width:140px;text-align:center}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:560px;margin:0 auto}
.month .dn{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.4px}
.month .day{aspect-ratio:1/1;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;font-family:var(--font);font-size:14px;font-weight:600;color:var(--text2);display:flex;align-items:center;justify-content:center;padding:0}
.month .day.on{background:var(--cell-done);border-color:var(--cell-done);color:#fff}
.month .day.today{border-color:var(--text)}
.month .day.fut{opacity:.55}
.month .blank{visibility:hidden}
.month .msum{grid-column:1/-1;text-align:center;font-size:13px;color:var(--muted);margin-top:4px}
.month .msum b{color:var(--text)}
.calsum i.nd{font-style:normal;color:var(--muted);font-weight:600}
.calsum{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-size:13px;color:var(--muted)}
.calsum b{font-size:22px;font-weight:800;color:var(--text);margin-right:2px}
.track.thin{height:4px;border:none;margin-top:8px}
.zoom{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.zoom span{min-width:52px;text-align:right}
.zoom input{width:90px;padding:0;background:none;border:none;accent-color:#2563eb;box-shadow:none}
.cal-title{font-size:13px;color:var(--text);letter-spacing:.4px}
.action .ahead .meta{font-size:13px}
.score{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:center;margin-top:14px;padding:16px 18px;border-radius:14px;background:var(--accent-soft)}
.score .pts{font-size:34px;font-weight:800;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.score .pts small{display:block;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-top:6px}
.score .lvl{font-size:15px;font-weight:800}
.score .lvl span{font-size:12px;font-weight:600;color:var(--muted);margin-left:6px}
.score .track{margin-top:6px;background:var(--surface)}
.score .how{grid-column:1/-1;font-size:11px;color:var(--muted)}
.score .wk{font-size:12px;color:var(--text2);margin-top:6px}
.score .wk b{color:var(--accent)}
.heat svg{display:block;width:100%;height:auto}
.tot.hit{color:var(--cell-done)}
.heat svg rect.c{cursor:pointer;transition:opacity .1s}
.heat svg rect.c:hover{opacity:.7}
/* process timeline */
.process{padding:22px 20px 18px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);position:relative;margin-top:16px}
.steps::before{content:"";position:absolute;left:12.5%;right:12.5%;top:17px;height:3px;background:var(--border);border-radius:2px}
.steps .fill{position:absolute;left:12.5%;top:17px;height:3px;background:var(--accent);border-radius:2px;transition:width .3s}
.st{position:relative;text-align:center;padding:0 6px;cursor:pointer}
.st .n{width:37px;height:37px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:var(--surface);border:3px solid var(--border);color:var(--muted);position:relative;z-index:1}
.st.ok .n{background:var(--accent);border-color:var(--accent);color:#fff}
.st.now .n{border-color:var(--text);color:var(--text)}
.st .t{font-weight:700;font-size:13px;margin-top:8px}
.st .v{font-size:12px;color:var(--text2);margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;padding-top:16px;border-top:1px dashed var(--border)}
.bar .top{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
.bar .top b{color:var(--text);font-size:12px}
.track{height:10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;border-radius:6px;transition:width .3s}
.bar .ends{display:flex;justify-content:space-between;font-size:10px;color:var(--muted2);margin-top:4px}
@media (max-width:560px){
  .steps{grid-template-columns:repeat(4,1fr)}
  .st .v{display:none}
  .st .t{font-size:11px}
  .bars{grid-template-columns:1fr}
}
dialog{border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--text);padding:22px;max-width:440px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(15,23,42,.45)}
dialog h3{margin:0 0 6px;font-size:16px}
dialog p{font-size:12px;color:var(--muted);margin:0 0 14px}
dialog label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin:10px 0 4px}
@media (max-width:820px){.grid3{grid-template-columns:1fr}}
@media (max-width:600px){.period select{font-size:16px}.period{flex:1;min-width:0}.period select{min-width:0}.period #selWeek{flex:1}}
@media (max-width:560px){
  .week{grid-template-columns:repeat(7,1fr) 40px;gap:4px}
  .chk{height:36px}
}
/* ===== action views + hand-drawn crosses ===== */
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;text-transform:none;letter-spacing:0}
.seg button{border:none;background:none;font-family:var(--font);font-size:12px;font-weight:800;color:var(--muted);padding:6px 12px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(15,23,42,.12)}
#actionCard .view{display:none}
#actionCard[data-view="week"] #week,#actionCard[data-view="month"] #monthView,#actionCard[data-view="year"] #yearView{display:block}
.chk,.month .day{position:relative;overflow:visible}
.chk.on,.month .day.on{background:var(--surface2);border-color:var(--border);color:var(--text2)}
.chk.on.today,.month .day.on.today{border-color:var(--text);box-shadow:none}
.xm{position:absolute;left:-14%;top:-14%;width:128%;height:128%;pointer-events:none;overflow:visible;z-index:2}
.xm path{fill:none;stroke:var(--text);stroke-width:16;stroke-linecap:round;stroke-linejoin:round}
.xm.new path{stroke-dasharray:110;stroke-dashoffset:110;animation:draw .18s ease-out forwards}
.xm.new path+path{animation-delay:.14s}
.xm.ck path{stroke:var(--accent)}
.cday.today.on{border-color:transparent}
@keyframes draw{to{stroke-dashoffset:0}}
.heat svg .yx{fill:none;stroke:var(--text);stroke-width:3.4;stroke-linecap:round;pointer-events:none}
button.big{font-size:13px;padding:9px 18px;margin-left:auto;line-height:inherit}
/* ===== round days ===== */
.month{margin-top:16px}
.dgrid,.month{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;max-width:520px;margin:0 auto}
.dc{display:flex;justify-content:center;align-items:center;min-width:0}
.cday{position:relative;overflow:visible;width:100%;max-width:46px;aspect-ratio:1/1;border-radius:50%;border:2px solid var(--border);background:var(--surface2);cursor:pointer;padding:0;font-family:var(--font);font-size:14px;font-weight:800;color:var(--text2);display:flex;align-items:center;justify-content:center}
.cday.today{border-color:var(--text)}
.cday.fut{opacity:.5}
.cday:hover{border-color:var(--text)}
.msum{grid-column:1/-1;text-align:center;font-size:14px;color:var(--muted);font-weight:600;margin-top:14px}
.msum b{color:var(--text);font-weight:900}
.mhead{margin:14px 0 12px}
.ygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 16px;margin-top:14px}
.ym{min-width:0}
.ymh{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:6px}
.ymh b{font-weight:800}.ymh span{font-weight:800;color:var(--accent)}
.ymg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.yd{position:relative;overflow:visible;aspect-ratio:1/1;border-radius:50%;border:none;background:var(--cell);padding:0;cursor:pointer}
.yd.today{box-shadow:0 0 0 1.5px var(--text)}
.yd.fut{opacity:.45}
.yd .xm path{stroke-width:18}
/* year view: trained days are just a loose hand-drawn cross (blue only for today), no filled dot behind it */
.yd.on{background:transparent}.yd.today.on{box-shadow:none}

.in-stage{position:relative;width:100%;max-width:460px}
.in-slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;transform:translateY(18px) scale(.98);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1)}

.in-step{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent)}

.in-cross svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.in-cross path{fill:none;stroke:var(--accent);stroke-width:13;stroke-linecap:round;stroke-dasharray:110;stroke-dashoffset:110}
.in-slide.on .in-cross path{animation:draw .28s ease-out .35s forwards}
.in-slide.on .in-cross path+path{animation-delay:.6s}
.in-eq{display:flex;flex-direction:column;gap:22px;padding:0 24px}
.in-row{text-align:center}
.in-term,.in-res{opacity:0;transform:translateY(12px);transition:opacity .4s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
.in-term.on,.in-res.on{opacity:1;transform:none}
.in-term{font-size:30px;font-weight:900;letter-spacing:-.8px;color:var(--text);line-height:1.15}

.k5-word b{display:block;font-size:min(96px,17vw);font-weight:900;letter-spacing:-.045em;line-height:.92;color:#fff;text-transform:uppercase}
.k5-word.long b{font-size:min(80px,12.8vw)}
.k5-word .xl{display:block;margin-top:8px;font-size:min(30px,7vw);font-weight:800;letter-spacing:-.01em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.k5-word em.neg{color:rgba(255,255,255,.35);text-decoration:line-through;text-decoration-thickness:4px}
.k5-word em.neg i{color:rgba(255,255,255,.25)}
.k5-word .pl{display:block;font-size:min(44px,10vw);font-weight:900;line-height:1;color:rgba(255,255,255,.28);margin-bottom:6px}
.k5-list i{font-style:normal;color:rgba(255,255,255,.3);margin-right:.18em}
.k5-list i{margin:0 .35em 0 0}
.k5-word em{opacity:0;transform:translateY(14px) scale(.9);transition:opacity .3s ease,transform .45s cubic-bezier(.2,1.4,.4,1)}
.k5-word.eq em{opacity:1;transform:none}
.k5-word em i{font-style:normal;color:rgba(96,165,250,.55)}
.k5-word small{display:block;margin-top:10px;font-size:13px;font-weight:600;color:rgba(255,255,255,.45);opacity:0;transition:opacity .4s ease .15s}
.k5-word.eq small,.k5-word:first-child.in small{opacity:1}
.k5-word em{display:block;font-style:normal;margin-top:18px;font-size:min(46px,10vw);font-weight:900;letter-spacing:-.02em;line-height:1;text-transform:uppercase;color:#60a5fa}
.k5-word{opacity:0;transform:scale(1.35);filter:blur(10px);transition:opacity .32s ease,transform .5s cubic-bezier(.16,1,.3,1),filter .4s ease}
.k5-word.in{opacity:1;transform:none;filter:none}
.k5-word.out{opacity:0;transform:translateY(-38vh) scale(.12);filter:blur(2px);transition:opacity .35s ease,transform .45s cubic-bezier(.6,0,.4,1),filter .3s}
.k5-end{position:relative;opacity:0;transform:translateY(24px);transition:opacity .4s ease,transform .6s cubic-bezier(.16,1,.3,1)}
.k5-end.in{opacity:1;transform:none}
.k5-cta{font-size:min(88px,16.5vw);font-weight:900;letter-spacing:-.045em;line-height:.9;color:#fff;text-transform:uppercase;text-align:left}
.k5-x{position:absolute;left:50%;top:50%;width:min(300px,62vw);height:min(300px,62vw);margin:calc(min(300px,62vw)/-2) 0 0 calc(min(300px,62vw)/-2);overflow:visible;opacity:0;transform:scale(2.2) rotate(-14deg);pointer-events:none}
.k5-x path{fill:none;stroke:#2563eb;stroke-width:15;stroke-linecap:round;mix-blend-mode:normal}
.k5-end.stamp .k5-x{opacity:.92;transform:scale(1) rotate(-4deg);transition:transform .32s cubic-bezier(.3,1.6,.5,1),opacity .12s ease}
.k5.shake{animation:k5shake .32s ease .18s}
@keyframes k5shake{0%,100%{transform:none}25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}75%{transform:translate(2px,1px)}}
@media (min-width:700px){.k5-list{font-size:13px}}
/* ===== intro v4 ===== */
#intro{background:#0a0f1a}
.in4{position:relative;max-width:440px;margin:0 auto;padding:0 32px;min-height:340px;display:flex;flex-direction:column;justify-content:center}
.in4-list{transition:opacity .6s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.in4.fin .in4-list{opacity:.22;transform:translateY(-34px) scale(.94);transform-origin:left center}
.in4-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:12px;padding:7px 0}
.in4-l{text-align:right}
.in4-t{font-size:min(30px,5.7vw);font-weight:800;letter-spacing:-.8px;line-height:1.15;color:#fff;white-space:nowrap}
.in4-t .px{display:inline-block;width:.56em;height:.56em;margin-right:.32em;vertical-align:.06em}
.in4-t .px svg{width:100%;height:100%;overflow:visible;display:block}
.in4-t .px path{fill:none;stroke:rgba(255,255,255,.45);stroke-width:24;stroke-linecap:round}
.ln{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.06em}
.ln>span{display:inline-block;transform:translateY(105%);transition:transform .62s cubic-bezier(.2,.9,.2,1)}
.in4-row.on .ln>span,.in4-cta.on .ln>span{transform:none}
.in4-l{font-size:12px;font-weight:700;letter-spacing:.4px;color:rgba(255,255,255,.42);opacity:0;transform:translateX(-8px);transition:opacity .4s ease,transform .5s cubic-bezier(.2,.8,.2,1);white-space:nowrap}
.in4-row.lbl .in4-l{opacity:1;transform:none}
.in4-l.res{color:#fff;padding-bottom:3px;background:linear-gradient(#60a5fa,#60a5fa) left bottom/0 2px no-repeat;transition:opacity .4s,transform .5s,background-size .5s ease .2s}
.in4-row.lbl .in4-l.res{background-size:100% 2px}
.in4-end{position:absolute;left:32px;right:32px;bottom:-40px;display:flex;align-items:center;gap:18px;pointer-events:none}
.in4-mark{width:76px;height:76px;flex:none;overflow:visible}
.in4-mark path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100}
.in4-mark circle{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.16);stroke-width:2;opacity:0;transform:scale(.6);transform-origin:50% 50%;transition:opacity .3s ease,transform .45s cubic-bezier(.2,1.3,.3,1)}
.in4-mark path{stroke:#fff;stroke-width:16}
.in4-mark.on circle{opacity:1;transform:none}
.in4-mark.on path{animation:dash .22s ease-out .3s forwards}
.in4-mark.on path+path{animation-delay:.52s}
@keyframes dash{to{stroke-dashoffset:0}}
.in4-cta{font-size:40px;font-weight:900;letter-spacing:-1.4px;color:#fff;line-height:1;white-space:nowrap}
@media (max-width:420px){.in4{padding:0 22px}.in4-end{left:22px;right:22px}.in4-t{letter-spacing:-.5px}.in4-l{font-size:11px}.in4-cta{font-size:min(34px,8.6vw)}.in4-mark{width:64px;height:64px}}
/* ===== intro v3: minimal ===== */
#intro .in-check{position:relative;width:84px;height:84px;margin-top:30px;display:block}
#intro .in-check .ring{position:absolute;inset:10px;border-radius:50%;border:3px solid rgba(255,255,255,.18)}
#intro .in-check svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#intro .in-check path{fill:none;stroke:#fff;stroke-width:13;stroke-linecap:round;stroke-dasharray:110;stroke-dashoffset:110}
#intro .in-check.on path{animation:draw .3s ease-out .2s forwards}
#intro .in-check.on path+path{animation-delay:.48s}
#intro{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#intro.paused *{animation-play-state:paused!important}
#intro.paused .in-skip::after{content:''}
#intro .in-pp{position:absolute;top:calc(22px + env(safe-area-inset-top));left:20px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.1);color:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
#intro .in-pp:hover{background:rgba(255,255,255,.18)}
#intro .in-skip{top:calc(28px + env(safe-area-inset-top))}
#intro .in-bar{top:calc(10px + env(safe-area-inset-top))}
#intro .in-tag.res{color:#fff;padding-bottom:3px;background:linear-gradient(#60a5fa,#60a5fa) left bottom/0 2px no-repeat;transition:opacity .35s,transform .45s cubic-bezier(.2,.8,.2,1),background-size .5s ease .25s}
#intro .in-tag.res.on{background-size:100% 2px}
#intro .in-tagline{margin-top:26px}
#intro{background:#0a0f1a}
#intro .in-row{border-bottom:none;padding:9px 0}
#intro .in-term{font-size:26px;font-weight:800;letter-spacing:-.6px}
#intro .in-term i{color:rgba(255,255,255,.35)}
#intro .in-tag{border:none;padding:0;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:none;color:rgba(255,255,255,.4)}
#intro .in-x path{stroke:#fff;stroke-width:12}
#intro .in-final{margin-top:28px}
#intro .in-final .eq{font-size:40px;font-weight:800;color:rgba(255,255,255,.35)}
#intro .in-final .word{font-size:60px;font-weight:900;letter-spacing:-2.2px;background:none;color:#fff}
#intro .in-tagline{font-size:14px;font-weight:600;color:#60a5fa;margin-top:10px}
#intro .in-bar{height:2px;background:rgba(255,255,255,.06)}
#intro .in-bar i{background:rgba(255,255,255,.5)}
#intro .in-skip{font-size:12px;color:rgba(255,255,255,.4)}
@media (max-width:420px){#intro .in-term{font-size:22px}#intro .in-final .word{font-size:52px}#intro .in-final .eq{font-size:34px}}
/* ===== progress stepper, refined ===== */
.cur{margin-top:10px}
.cur-v{font-size:64px;font-weight:900;letter-spacing:-2.5px;line-height:1;font-variant-numeric:tabular-nums}
.cur-v span{font-size:22px;font-weight:800;letter-spacing:0;margin-left:6px;color:var(--text)}
.cur-l{margin-top:8px;font-size:13px;font-weight:600;color:var(--muted)}
.cur-l b.up{color:var(--good)}.cur-l b.dn{color:var(--accent)}
#progCard:has(#pmore[hidden]) .wrows,#progCard:has(#pmore[hidden]) .wnote,#progCard:not(:has(#pmore[hidden])) .fc-in{display:none}
.wrows{margin-top:14px}
.wr{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;font-size:13px;font-weight:600;color:var(--muted)}
.wr b{font-size:14px;font-weight:800;color:var(--text)}.wr.now span,.wr.now b{color:var(--accent)}
.wr.gap{margin-top:6px;padding-top:13px;border-top:1px solid var(--border)}
.wr b i{font-style:normal;font-size:12px;font-weight:700;margin-right:8px}.wr .up{color:var(--good)}.wr .dn{color:var(--accent)}
.wr i.pm{font-style:normal;font-size:12px;font-weight:700;color:var(--muted);margin:0 3px 0 5px}
.wnote{margin:4px 0 0;font-size:11px;font-weight:600;color:var(--muted2)}
.wpers{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--muted)}
.wp-r{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0}.wp-r b{font-weight:800;color:var(--text)}.wp-r.now span,.wp-r.now b{color:var(--accent);font-weight:800}
.wpers p{margin:8px 0 0;line-height:1.4}.wpers p.wp-s{font-size:11.5px;opacity:.85}
.wfc{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 10px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;font-weight:700;color:var(--muted)}.wfc b{font-size:15px;font-weight:800;color:var(--text)}.wfc.wm{margin-top:-4px;padding-top:0;border-top:0}.wfc.wm b{color:var(--text)}.wfc b.up{color:var(--good)}.wfc b.dn{color:var(--accent)}
.wfat{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:10px 0;padding-top:10px;border-top:1px solid var(--border);font-size:13px;font-weight:700;color:var(--muted)}.wfat b{font-size:15px;font-weight:800;color:var(--text)}.wfat b.up{color:var(--good);font-size:13px}.wfat b.dn{color:var(--accent);font-size:13px}
@media (max-width:560px){.cur-v{font-size:56px}}
/* collapsed Progress: same size as Goal / Deadline / Plan */
#progCard:has(#pmore[hidden]) .cur{margin-top:8px}
#progCard:has(#pmore[hidden]) .cur-v{font-size:38px;letter-spacing:-1px}
#progCard:has(#pmore[hidden]) .cur-v span{font-size:inherit;margin-left:4px}
#progCard:has(#pmore[hidden]) .cur-l{margin-top:6px}
@media (max-width:560px){#progCard:has(#pmore[hidden]) .cur-v{font-size:32px}}
.chart-head{display:flex;justify-content:space-between;align-items:center;margin-top:26px;padding-top:18px;border-top:1px solid var(--border);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px}
.process .steps{margin-top:20px;grid-template-columns:repeat(4,minmax(0,1fr))}
.process .st{min-width:0;padding:0 2px}
.process .steps::before{top:21px;height:4px;left:12.5%;right:12.5%;background:var(--surface2);border-radius:4px}
.process .steps .fill{top:21px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent),#60a5fa)}
.process .st .n{width:46px;height:46px;border:none;background:var(--surface2);color:var(--muted);font-size:15px;font-weight:900;transition:transform .15s}
.process .st:hover .n{transform:translateY(-2px)}
.process .st.ok .n{background:linear-gradient(145deg,#3b82f6,var(--accent));color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.32)}
.process .st.now .n{background:var(--surface);color:var(--accent);box-shadow:inset 0 0 0 3px var(--accent);animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:inset 0 0 0 3px var(--accent),0 0 0 0 rgba(37,99,235,.35)}70%{box-shadow:inset 0 0 0 3px var(--accent),0 0 0 12px rgba(37,99,235,0)}100%{box-shadow:inset 0 0 0 3px var(--accent),0 0 0 0 rgba(37,99,235,0)}}
.process .st .t{font-size:13px;font-weight:800;margin-top:12px;color:var(--text)}
.process .st:not(.ok):not(.now) .t{color:var(--muted)}
.process .st .v{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-line-clamp:unset}
.process .st.now .v{color:var(--accent);font-weight:800}
.process .bars{border-top:none;margin-top:14px;padding-top:0}
@media (max-width:560px){
  .process .st .n{width:40px;height:40px;font-size:14px}
  .process .steps::before,.process .steps .fill{top:18px}
  .process .st .t{font-size:12px;margin-top:9px}
  .process .st .v{display:block;font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){.process .st.now .n{animation:none}}
@media (max-width:380px){.pill span{font-size:11px;letter-spacing:-.1px}}
.quotes{padding:0;overflow:hidden}
.q-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.q-track::-webkit-scrollbar{display:none}
.q-slide{flex:0 0 100%;scroll-snap-align:start;box-sizing:border-box;padding:30px 26px 14px;min-height:150px;display:flex;align-items:center}
.q-slide p{margin:0;font-size:24px;font-weight:900;letter-spacing:-.5px;line-height:1.15;color:var(--text)}
.q-slide p::before{content:'“';display:block;font-size:44px;line-height:.6;height:22px;color:var(--accent)}
.q-dots{display:flex;justify-content:center;gap:6px;padding:4px 0 18px}
.q-dots button{all:unset;cursor:pointer;width:7px;height:7px;border-radius:50%;background:var(--border)}.q-dots button.on{background:var(--accent);width:18px;border-radius:4px}
.q-ov{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;transition:opacity .2s}
.q-ov.in{opacity:1}.q-ov[hidden]{display:none}
.q-ov .quotes{position:relative;width:100%;max-width:520px;margin:0;transform:translateY(10px) scale(.98);transition:transform .25s cubic-bezier(.2,.8,.2,1)}.q-ov.in .quotes{transform:none}
.q-ov .q-slide{min-height:240px;padding:44px 28px 18px}.q-ov .q-slide p{font-size:28px}
.q-x{all:unset;cursor:pointer;position:absolute;top:10px;right:12px;z-index:2;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1;color:var(--muted);background:var(--surface2)}
@media (max-width:430px){header{gap:8px}.hdr-right{gap:6px!important}header .themebtn{width:34px;height:34px}.hello,header h1{font-size:25px}}
</style>

<body>
<div class="wrap">
  <header>
    <div>
      <div class="hello" id="hello" hidden></div>
      <h1><button class="who" id="who" title="Account">Health</button></h1>
      <div class="sync"><span class="dot" id="dot"></span><span id="syncText">Local</span></div>
    </div>
    <div class="hdr-right">
      <div class="period" title="Year and week shown in Action">
        <select id="selYear" aria-label="Year"></select>
        <select id="selWeek" aria-label="Week"></select>
      </div>
      <button class="themebtn" id="quoteBtn" title="Quotes" aria-label="Open quotes" hidden><svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M4 17.5c0-3.6 1.2-7.4 4.6-10.5l1.6 1.4C8.4 10.3 7.6 12 7.5 13.6c1.6 0 2.9 1.3 2.9 2.9S9.1 19.4 7.3 19.4C5.4 19.4 4 18.2 4 17.5zm9.6 0c0-3.6 1.2-7.4 4.6-10.5l1.6 1.4c-1.8 1.9-2.6 3.6-2.7 5.2 1.6 0 2.9 1.3 2.9 2.9s-1.3 2.9-3.1 2.9c-1.9 0-3.3-1.2-3.3-1.9z"/></svg></button>
      <button class="themebtn" id="playBtn" title="Play intro" aria-label="Play intro"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg></button>
      <button class="themebtn" id="themeBtn" title="Light / dark" aria-label="Toggle dark mode" hidden></button>
      <button class="themebtn" id="setBtn" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>

  <!-- Overview: one score for everything -->
  <div class="card" id="overCard" hidden>
    <div class="label"><span class="ttl"><svg class="calicon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.2s-7.6-4.6-7.6-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.6 2.7c0 5.6-7.6 10.2-7.6 10.2z"/></svg></span>
      <div class="seg" id="ovSeg" aria-label="Score period"><button data-p="day">Day</button><button data-p="week">Week</button><button data-p="month">Month</button><button data-p="year">Year</button></div></div>
    <div class="ov-top"><div id="ovRing"></div><div class="ov-side"><div class="ov-delta" id="ovDelta"></div><div class="ov-note" id="ovNote"></div></div></div>
    <div class="ov-rows" id="ovRows"></div>
    <div class="ov-trend"><button type="button" class="ov-th cg-tog" data-tog="trend"><span>Last 12 weeks</span><b id="ovTrendTxt"></b></button><div id="ovSpark"></div></div>
  </div>

  <!-- Friends (part of the Score tab): training only (days, plan, consistency); 1v1 with one friend, a ranking with more -->
  <div class="card" id="friendCard" hidden>
    <div class="label fr-l"><button type="button" class="fr-h" data-tog="friends" aria-label="Show friends"><span class="ttl"><svg class="calicon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.2" r="3.3"/><path d="M3.2 19.5c.6-3.3 2.9-5.2 5.8-5.2s5.2 1.9 5.8 5.2"/><circle cx="17.2" cy="9.2" r="2.6"/><path d="M16.2 14.4c2.5-.3 4.3 1.3 4.9 4.4"/></svg>Friends</span><span class="fr-sum" id="frSum"></span></button><button type="button" class="cal-share fr-share" id="frShare" aria-label="Share ranking"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button></div>
    <div class="fr-ctl" id="frCtl"><div class="seg" id="frSeg" aria-label="Period"><button data-p="week">Week</button><button data-p="month">Month</button><button data-p="year">Year</button></div><button type="button" class="fr-info" data-frinfo aria-label="How Friends and Boost work">i</button></div>
    <div id="frBody"></div>
    <div class="fr-by" id="frByRow"><div class="seg" id="frBy" aria-label="Rank by"><button data-by="training">Training</button><button data-by="cons">Consistency</button></div></div>
  </div>

<script>

const LS_AUTH='training.auth';

const remote=()=>!!(auth&&auth.token);
const setData=j=>{S={settings:j.settings||{},weight:j.weight||[],actions:j.actions||[],modules:j.modules||['training'],quotes:j.quotes||[],friends:j.friends||[],friendList:j.friendList||[],boosts:j.boosts||{received:[],sent:[]}};ls.set(LS_DATA(),S);};

const greet=()=>{const h=new Date().getHours();return h>=5&&h<12?'Good morning,':h>=12&&h<18?'Good afternoon,':h>=18&&h<23?'Good evening,':'Good night,';};
function showWho(){const w=$('who');w.textContent=auth?auth.name:'Log in';w.classList.toggle('out',!auth);const g=$('hello');g.hidden=!auth;g.textContent=auth?greet():'';}

// the dot only draws attention when needed: red on errors, green for 5 s after loading; otherwise neutral
let syncT=0;function setSync(state,text){const d=document.getElementById('dot');clearTimeout(syncT);d.className='dot '+(state==='busy'?'':state||'');document.getElementById('syncText').textContent=text;
  if(state==='ok')syncT=setTimeout(()=>{if(d.classList.contains('ok'))d.className='dot';},5000);}

async function load(){
  showWho();
  if(!remote()){setSync('','Not logged in');render();setTimeout(askLogin,300);return;}
  S=ls.get(LS_DATA(),S);render();setSync('busy','Loading…');
  try{
    const r=await fetch(API_URL+'?name='+encodeURIComponent(auth.name)+'&token='+encodeURIComponent(auth.token));
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'Error');
    setData(j);setSync('ok','Connected to Google');
  }catch(e){setSync('err','Sheet unreachable: '+e.message);if(/log in/i.test(e.message)){logout();setTimeout(askLogin,300);}}
  render();
}

// Optimistic: update locally first, then write to the sheet.
async function save(payload){
  if(!remote()){render();askLogin();return;}
  ls.set(LS_DATA(),S);render();
  setSync('busy','Saving…');
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,name:auth.name,token:auth.token})});
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'Error');
    setData(j);setSync('','Saved to Google');render();
  }catch(e){setSync('err','Not saved: '+e.message);}
}
function saveSettings(obj){Object.assign(S.settings,obj);save({type:'settings',settings:obj});}

// ---------- helpers ----------
const LOC='en-GB';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d);};
const todayIso=iso(new Date());
const fmtD=s=>parse(s).toLocaleDateString(LOC,{day:'numeric',month:'short',year:'numeric'});
const fmtDs=s=>parse(s).toLocaleDateString(LOC,{day:'numeric',month:'short'});
const fmtKg=v=>(Math.round(v*10)/10).toLocaleString(LOC,{minimumFractionDigits:1,maximumFractionDigits:1});
// Modules (switched on per person in the sheet's Users tab). A day counts as done when all its items are ticked.
const MODS={
  training:{label:'Training',title:'Training',groups:[{items:['Training']}],plan:'daysPerWeek',def:0,
    icon:'<rect x="4.4" y="5" width="4" height="14" rx="1.5"/><rect x="15.6" y="5" width="4" height="14" rx="1.5"/><path d="M8.4 12h7.2M2 9.3v5.4M22 9.3v5.4"/>'},
  food:{label:'Nutrition',title:'Nutrition',plan:'foodPerWeek',def:6,target:'foodTarget',tdef:85,
    water:{max:8,goal:5,ml:500},
    groups:[{label:'Meals',items:['Breakfast','Lunch','Dinner'],cols:3},{label:'Extras',items:['Protein','Creatine','Evening','Snack'],cols:4,bonus:true}],
    // every tick counts towards 100: water 20 (per bottle up to 5), meals 15 each, protein/creatine/quark 10, snack 5
    pts:{Water:20,Breakfast:15,Lunch:15,Dinner:15,Protein:10,Creatine:10,Evening:10,Snack:5},
    goal:'Fuel the gains',note:'2.5 L water, three meals and your extras.\nWater 20 · each meal 20 · extras 20 together.',
    icon:'<path d="M7 3v18M4.5 3v5.5a2.5 2.5 0 0 0 5 0V3M17.5 21V3c-2.2 1.2-3.5 4-3.5 7.5V13h3.5"/>'},
  sleep:{label:'Sleep',title:'Sleep',plan:'sleepPerWeek',def:5,target:'sleepTarget',tdef:75,
    groups:[],rating:true, // one rating per night: Sleep:1..5 = 20..100
    goal:'Wake up rested',note:'In bed by 23:00 and 7+ hours of sleep.\nRate every night, aim for Good or Great.',
    icon:'<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/>'},
};
Object.values(MODS).forEach(M=>{M.items=M.groups.flatMap(g=>g.items);M.base=M.groups.filter(g=>!g.bonus).flatMap(g=>g.items);M.bonus=M.groups.filter(g=>g.bonus).flatMap(g=>g.items);});
const ITEM_LBL={Training:'Trained today',Evening:'Quark'}; // stored key stays 'Evening' so old ticks keep counting
const EXTRAS=['Protein','Creatine','Evening','Snack'],X_MAX=14; // the four Nutrition extras: name them yourself in Settings
// not named yet: Creatine is on for everyone; the others only if you ticked them before (so existing users keep theirs)
const xDef=a=>a==='Creatine'||(S.actions||[]).some(x=>x.action===a)?(ITEM_LBL[a]||a):'';
const xLbl=a=>{const v=S.settings['x_'+a];return v==null?xDef(a):String(v).slice(0,X_MAX);};
const xOn=()=>EXTRAS.filter(a=>xLbl(a).trim()!=='');
const itemLbl=a=>EXTRAS.includes(a)?xLbl(a):(ITEM_LBL[a]||a);
const ITEM_HINT={};
const hasScore=()=>(S.modules||[]).includes('score'); // Score tab (with Friends) is switched on per person, like Nutrition
const userMods=()=>{const m=(S.modules||['training']).filter(x=>MODS[x]);return m.length?m:['training'];};
let mod=(()=>{try{return localStorage.getItem('training.mod')||'training'}catch(e){return 'training'}})();
const perWeek=()=>{const M=MODS[mod],n=parseInt(S.settings[M.plan],10);return n>=1&&n<=7?n:M.def;};
const has=(d,a)=>S.actions.some(x=>x.date===d&&x.action===a);
const RATE=[{l:'Bad',m:'M8 16.6c1.1-1.5 2.4-2.2 4-2.2s2.9.7 4 2.2'},{l:'Poor',m:'M8.6 16c.9-.7 2.1-1.1 3.4-1.1s2.5.4 3.4 1.1'},{l:'OK',m:'M8.6 15.2h6.8'},{l:'Good',m:'M8.6 14.4c.9.8 2.1 1.2 3.4 1.2s2.5-.4 3.4-1.2'},{l:'Great',m:'M7.9 13.7c1.1 1.8 2.5 2.8 4.1 2.8s3-1 4.1-2.8'}];
const rateOf=d=>{const a=S.actions.find(x=>x.date===d&&/^Sleep:[1-5]$/.test(x.action));return a?+a.action.slice(6):0;};
const face=i=>`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><circle cx="9" cy="10" r="1.1" class="eye"/><circle cx="15" cy="10" r="1.1" class="eye"/><path d="${RATE[i].m}"/></svg>`;
// rate a night: tap the same face again to clear it
function setRating(d,n){const cur=rateOf(d),set={};lastToggled=d;setTimeout(()=>{lastToggled=null;},600);
  for(let k=1;k<=5;k++){const on=k===n&&n!==cur,was=k===cur;if(on!==was)set['Sleep:'+k]=on;}
  S.actions=S.actions.filter(x=>!(x.date===d&&/^Sleep:[1-5]$/.test(x.action)));
  if(n!==cur)S.actions.push({date:d,action:'Sleep:'+n});
  save({type:'batch',date:d,set});}
const wGoal=()=>{const l=parseFloat(S.settings.waterL);return Math.round((l>=1&&l<=4?l:2.5)*2);}; // goal in 500 ml bottles
const waterN=d=>S.actions.filter(a=>a.date===d&&/^Water:\d$/.test(a.action)).length;
// a day is done when every tick is set (and, for Food, the water goal is reached)
const trained=()=>{const M=MODS[mod],by={};
  if(M.rating)return new Set(S.actions.filter(a=>/^Sleep:[45]$/.test(a.action)).map(a=>a.date));
  S.actions.forEach(a=>{if(M.base.includes(a.action))(by[a.date]=by[a.date]||new Set()).add(a.action);});
  if(M.water){const ds=new Set(S.actions.filter(a=>a.action.startsWith('Water:')||M.items.includes(a.action)).map(a=>a.date));return new Set([...ds].filter(d=>dayVal(mod,d)>=100));}
  return new Set(Object.keys(by).filter(d=>by[d].size===M.base.length));};
const mondayOf=d=>{const m=new Date(d.getFullYear(),d.getMonth(),d.getDate());m.setDate(m.getDate()-((m.getDay()+6)%7));return m;};
const isoWeek=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7);};
// Goal start: progress (time, weight, plan line) is measured from the day the goal was set.
const goalStart=()=>S.settings.goalStart||todayIso;
const actStart=()=>{if(mod==='training')return iso(mondayOf(parse(goalStart()))); // training counts from the Monday of your start week (same as Score and Friends)
const ds=S.actions.filter(a=>MODS[mod].items.includes(a.action)||(MODS[mod].water&&/^Water:/.test(a.action))||(MODS[mod].rating&&/^Sleep:[1-5]$/.test(a.action))).map(a=>a.date).sort();return ds[0]&&ds[0]<todayIso?ds[0]:todayIso;};
function startWeight(W){ // last measurement before the goal start day, else the first one on/after it
  if(!W.length)return null;
  const before=W.filter(w=>w.date<goalStart());
  return before.length?before[before.length-1]:W[0];
}
// Trend: linear fit over the last 6 weeks of measurements (at least 3 points).
// Daily weight curve: you weigh least right after waking and most in the evening (food + drink).
// kg gained per hour after 07:00, from your own timed measurements once there are enough, else a typical ~0.09%/h (~1 kg over a day)
const hourOf=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||'');return m?+m[1]+m[2]/60:null;};
// ---------- weight model: one Kalman filter for trend weight, pace and your day curve ----------
// state: level = your true 07:00 weight, pace = kg per day, curve = kg per hour later in the day.
// every weigh-in = level + curve × (hour − 7) + noise (food, drink, water: ±0.45 kg).
// It starts from sensible defaults and gets more personal with every measurement,
// fastest from a morning and an evening weigh-in on the same day.
const KM={noise:.45,levelQ:.03,paceQ:.002,curveQ:.0003};
let KM_CACHE=null;
function weightModel(){
  const key=S.weight.length+'|'+S.weight.map(w=>w.date+w.time+w.kg).join(',').length;
  if(KM_CACHE&&KM_CACHE.key===key&&KM_CACHE.ref===S.weight)return KM_CACHE.m;
  const R=[...S.weight].filter(w=>w.kg>0).sort(byDT);let m=null;
  if(R.length){
    const uh=medHour(R)??7,kg0=R[0].kg,c0=kg0*.0009,cs=kg0*.0006; // default ≈ +1.1 kg from 07:00 to 22:00 at 80 kg
    let x=[kg0,0,c0],P=[[4,0,0],[0,.06**2,0],[0,0,cs*cs]],tPrev=parse(R[0].date).getTime()/864e5,nt=0;
    const hrs=new Set(),days={};
    R.forEach(w=>{const t=parse(w.date).getTime()/864e5,dt=Math.max(0,t-tPrev);tPrev=t;
      // predict: level moves with the pace; uncertainty grows with time
      x=[x[0]+dt*x[1],x[1],x[2]];
      const a=P;P=[[a[0][0]+2*dt*a[0][1]+dt*dt*a[1][1]+KM.levelQ**2*dt,a[0][1]+dt*a[1][1],a[0][2]+dt*a[1][2]],
        [a[1][0]+dt*a[1][1],a[1][1]+KM.paceQ**2*dt,a[1][2]],[a[2][0]+dt*a[2][1],a[2][1],a[2][2]+KM.curveQ**2*dt]];
      // update with this weigh-in
      const hh=hourOf(w.time),h=Math.min(22,Math.max(7,hh??uh)),e=h-7,Hm=[1,0,e],r=(hh==null?1.5:1)*KM.noise**2;
      if(hh!=null){nt++;hrs.add(Math.round(h));(days[w.date]=days[w.date]||[]).push(h);}
      const PH=[0,1,2].map(i=>P[i][0]+P[i][2]*e),Sv=PH[0]+PH[2]*e+r,K=PH.map(v=>v/Sv),y=w.kg-(x[0]+x[2]*e);
      x=x.map((v,i)=>v+K[i]*y);P=P.map((row,i)=>row.map((v,j)=>v-K[i]*PH[j]));});
    const pairs=Object.values(days).filter(hs=>Math.max(...hs)-Math.min(...hs)>=4).length;
    m={level:x[0],pace:x[1],curve:x[2],P,lastT:tPrev*864e5,n:R.length,nt,pairs,learned:Math.max(0,Math.min(1,1-Math.sqrt(P[2][2])/cs))};}
  KM_CACHE={key,ref:S.weight,m};return m;}
// day curve used everywhere: from the model, between +0.5 and +3 kg from 07:00 to 22:00
function dayCurve(){const m=weightModel(),kg=m?m.level:80;
  if(!m)return {slope:kg*.0009,own:false,n:0,learned:0};
  return {slope:Math.min(3/15,Math.max(.5/15,m.curve)),own:m.learned>=.7,n:m.nt,pairs:m.pairs,learned:m.learned};}
// All measurements as 07:00 morning weight, so the time you weigh no longer matters.
// kg = morning estimate, raw = what the scale said; untimed measurements are taken as your usual time.
const byDT=(a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||'');
const medHour=W=>{const hs=W.map(w=>hourOf(w.time)).filter(v=>v!=null).sort((a,b)=>a-b);return hs.length?hs[Math.floor(hs.length/2)]:null;};
function weights(){const R=[...S.weight].sort(byDT),dc=dayCurve(R),uh=medHour(R);
  return R.map(w=>{const h=hourOf(w.time)??uh;return {...w,raw:w.kg,kg:h==null?w.kg:Math.round(atHour(w.kg,h,7,dc.slope)*10)/10};});}
const atHour=(kg,from,to,sl)=>kg+sl*(Math.min(22,Math.max(7,to))-Math.min(22,Math.max(7,from)));
// Expected weight = trend weight now + pace × time to the deadline (pace capped at 1% of your weight per week)
function trend(){const m=weightModel();if(!m||m.n<2)return null;
  const cap=m.level*.01/7,slope=Math.max(-cap,Math.min(cap,m.pace)),P=m.P;
  const sd=t=>{const d=(t-m.lastT)/864e5;return Math.sqrt(Math.max(0,P[0][0]+2*d*P[0][1]+d*d*P[1][1]));};
  return {slope,lastT:m.lastT,start:m.level,capped:Math.abs(m.pace)>cap,at:t=>m.level+slope*(t-m.lastT)/864e5,sd};}
let year=new Date().getFullYear();
let weekStart=mondayOf(new Date());
let monthStart=new Date(new Date().getFullYear(),new Date().getMonth(),1);

// A hand-drawn looking cross, slightly different per day (seeded by the date), larger than its box.
function hashStr(k){let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))|0;return h;}
// blue=true: today's cross, drawn in blue (earlier days stay black)
function crossSVG(k,blue){

    +`<path d="M${18+j(1)} ${20+j(2)} Q${50+j(3)} ${47+j(4)} ${82+j(5)} ${80+j(6)}"/>`
    +`<path d="M${81+j(7)} ${19+j(8)} Q${52+j(9)} ${51+j(1)} ${19+j(2)} ${83+j(3)}"/></g></svg>`;
}
let lastToggled=null;

  const on=has(d,a);
  if(on)S.actions=S.actions.filter(x=>!(x.date===d&&x.action===a));else S.actions.push({date:d,action:a});

}

function toggle(d){const M=MODS[mod];if(M.items.length===1&&!M.water)return toggleItem(d,M.items[0]);openDay(d);}

const CHK_X='2026-11-06Dinner';

  const tw=Number(S.settings.targetKg)||null, dl=S.settings.deadline||null;
  let h='';
  if(W.length){
    const sw=startWeight(W),first=sw.kg,last=W[W.length-1].kg;
    const toward=d=>tw?(Math.sign(tw-first)===Math.sign(d)||d===0):d<=0;
    const prev=W.length>1?W[W.length-2].kg:null,ch=prev===null?null:last-prev;
    const tr=trend(W),tf=dl&&tw?parse(dl).getTime():null; // expected weight: only with a target weight and a deadline
    const fk=tr&&tf&&tf>tr.lastT?tr.at(tf):null,ok=fk!=null&&(Math.abs(fk-tw)<=0.5||(tw>=first?fk>=tw:fk<=tw));
    // big current weight; folded card also shows the expected weight inline
    h+=`<div class="cur"><div class="cur-v">${fmtKg(last)}<span>kg</span></div><div class="cur-l">Morning weight · ${fmtDs(W[W.length-1].date)}${ch===null||Math.abs(ch)<0.05?'':` · <b class="${toward(ch)?'up':'dn'}">${ch>0?'+':''}${fmtKg(ch)} kg</b>`}${fk!=null?` <span class="fc-in">· Expected <b class="${ok?'up':'dn'}">${fmtKg(fk)} kg</b></span>`:''}</div></div>`;
    // one quiet list: your last measurement in your day, then body composition, then where you're heading
    const R2=[...S.weight].sort(byDT),L=R2[R2.length-1],h0=hourOf(L.time),dc=dayCurve(),f=v=>fmtKg(Math.round(v*10)/10);
    const hs=R2.slice(0,-1).map(w=>hourOf(w.time)).filter(v=>v!=null).sort((a,b)=>a-b),uh=hs.length>=2?hs[Math.floor(hs.length/2)]:null;
    const row=(l,v,c='')=>`<div class="wr${c?' '+c:''}"><span>${l}</span><b>${v}</b></div>`;
    let rows='';
    if(h0!=null){
      if(Math.abs(h0-7)>=0.5)rows+=row('Morning · 07:00','≈ '+f(atHour(L.kg,h0,7,dc.slope))+' kg');
      rows+=row('Measured · '+L.time,f(L.kg)+' kg','now');
      if(h0<21&&!(uh!=null&&uh>=21))rows+=row('Evening · 22:00','≈ '+f(atHour(L.kg,h0,22,dc.slope))+' kg');}
    const F=W.filter(w=>w.fat!=null);
    if(F.length){const lf=F[F.length-1],df=lf.fat-F[0].fat,lean=lf.raw*(1-lf.fat/100);
      rows+=row('Body fat',`${F.length>1&&Math.abs(df)>=0.05?`<i class="${df<=0?'up':'dn'}">${df>0?'+':''}${fmtKg(df)}</i>`:''}${fmtKg(lf.fat)}%`,'gap');
      rows+=row('Lean mass',fmtKg(lean)+' kg');}
    // where you're heading: trend weight + pace, expected at the deadline (± band), and when you reach your goal
    if(tr){const wk=tr.slope*7;rows+=row(`Trend${Math.abs(wk)>=.05?` · ${wk>0?'+':''}${fmtKg(wk)} kg/week`:' · stable'}`,fmtKg(tr.start)+' kg','gap');
      if(fk!=null){const band=tr.sd(tf);rows+=row('Expected · '+fmtDs(dl),`<span class="${ok?'up':'dn'}">${fmtKg(fk)}</span><i class="pm">± ${fmtKg(Math.max(.1,band))}</i> kg`);}
      if(tw&&Math.abs(tr.start-tw)>=.2&&Math.sign(tw-tr.start)===Math.sign(tr.slope)&&Math.abs(tr.slope)>.005){const dd=(tw-tr.start)/tr.slope;
        if(dd<730){const gd=iso(new Date(tr.lastT+dd*864e5));rows+=row('Goal '+fmtKg(tw)+' kg','≈ '+fmtDs(gd));}}}
    const pc=Math.round(dc.learned*100),dcn=dc.learned>=.7?`Your day curve: +${fmtKg(dc.slope*15)} kg from 07:00 to 22:00`
      :`Day curve +${fmtKg(dc.slope*15)} kg (07–22)${pc>=5?` · ${pc}% yours`:''} · weigh in morning + evening on one day to learn it`;
    h+=`<div class="wrows">${rows}</div>`
      +(h0==null?`<p class="wnote">Add the time to a measurement to see it in your day.</p>`:`<p class="wnote">${dcn}</p>`);
  }else h='<div class="sub">No measurements yet. Add your first weight below.</div>';
  $('wStats').innerHTML=h;
  {const up=tw?tw>=(W.length?startWeight(W).kg:0):false;
   $('wList').innerHTML=W.length?`<table><thead><tr><th>kg</th><th>Date</th><th></th></tr></thead><tbody>${[...W].map((w,i)=>{const d=i?w.kg-W[i-1].kg:null;
     const cls=d===null||Math.abs(d)<0.05?'nc':((d>0)===up?'up':'dn');
     return `<tr><td class="kg">${fmtKg(w.kg)}${d===null||Math.abs(d)<0.05?'':`<i class="chg ${cls}">${(d>0?'+':'')+fmtKg(d)}</i>`}</td><td class="dt">${parse(w.date).toLocaleDateString(LOC,{day:'numeric',month:innerWidth<340?'short':'long'})}${w.date.slice(0,4)!==String(new Date().getFullYear())?' '+w.date.slice(2,4):''}${w.time?` <i class="tm">${w.time}${Math.abs(w.raw-w.kg)>=0.05?' · '+fmtKg(w.raw)+' kg':''}</i>`:''}${w.fat!=null?` <i class="tm">· ${fmtKg(w.fat)}% fat</i>`:''}</td><td><button title="Delete" aria-label="Delete measurement" data-del="${w.date}|${w.time||''}"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></button></td></tr>`;}).reverse().join('')}</tbody></table>`:'';}
}

// Chart zoom: how far back the chart shows (0 = everything)
const ZOOMS=[['All',0],['1 year',365],['6 months',182],['3 months',91],['1 month',30]];
let zoomI=(()=>{try{const raw=localStorage.getItem('training.zoom');if(raw===null)return innerWidth<600?3:0;const v=+raw;return v>=0&&v<ZOOMS.length?v:0}catch(e){return innerWidth<600?3:0}})();
function drawChart(W,tw,dl){
  const wrap=$('chartWrap');wrap.querySelector('svg')?.remove();$('tip').style.display='none';
  if(!W.length)return;
  const width=Math.max(200,wrap.clientWidth),height=width<420?200:240,m={l:34,r:8,t:12,b:26};
  const tr=trend(W);
  const ref=Math.max(parse(W[W.length-1].date).getTime(),parse(todayIso).getTime());
  const t0=ZOOMS[zoomI][1]?Math.max(parse(W[0].date).getTime(),ref-ZOOMS[zoomI][1]*864e5):parse(W[0].date).getTime();
  // y-range follows what is visible (plus the point just before the window, for a continuous line)
  const firstVis=Math.max(0,W.findIndex(w=>parse(w.date).getTime()>=t0)-1);
  const Wv=W.slice(firstVis);
  let t1=Math.max(parse(W[W.length-1].date).getTime(),parse(todayIso).getTime());
  if(dl)t1=Math.max(t1,parse(dl).getTime());
  if(t1-t0<7*864e5)t1=t0+7*864e5;
  const tf=dl&&tw?parse(dl).getTime():null; // expected weight at the deadline (only with a target)
  const vals=Wv.map(w=>w.kg);if(tw)vals.push(tw);if(tr&&tf)vals.push(tr.at(tf));
  let lo=Math.min(...vals),hi=Math.max(...vals);const padv=Math.max(1,(hi-lo)*.15);lo=Math.floor(lo-padv);hi=Math.ceil(hi+padv);
  const x=t=>m.l+(t-t0)/(t1-t0)*(width-m.l-m.r), y=v=>m.t+(hi-v)/(hi-lo)*(height-m.t-m.b);
  let s=`<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><defs><clipPath id="plotClip"><rect x="${m.l}" y="0" width="${width-m.l}" height="${height-m.b}"/></clipPath></defs>`;
  const step=Math.max(1,Math.ceil((hi-lo)/4));
  for(let v=Math.ceil(lo);v<=hi;v+=step){s+=`<line x1="${m.l}" x2="${width-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`;}
  const d=new Date(t0);d.setDate(1);d.setMonth(d.getMonth()+1);
  const months=[];while(d.getTime()<=t1){months.push(new Date(d));d.setMonth(d.getMonth()+1);}
  const every=Math.ceil(months.length/8)||1;
  months.forEach((md,i)=>{if(i%every)return;s+=`<text x="${x(md.getTime())}" y="${height-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${md.toLocaleDateString(LOC,{month:'short'})}${md.getMonth()===0?" '"+String(md.getFullYear()).slice(2):''}</text>`;});
  if(tw)s+=`<line x1="${m.l}" x2="${width-m.r}" y1="${y(tw)}" y2="${y(tw)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  const sw=startWeight(W),gs=parse(goalStart()).getTime();
  if(tw&&dl&&sw)s+=`<line x1="${x(Math.max(t0,gs))}" y1="${y(sw.kg)}" x2="${x(parse(dl).getTime())}" y2="${y(tw)}" stroke="var(--muted2)" stroke-width="1.5" stroke-dasharray="2 4"/>`;
  // forecast: trend line from the last measurement to the deadline
  if(tr&&tf&&tf>tr.lastT){const fx=x(tf),fy=y(tr.at(tf));
    s+=`<line x1="${x(tr.lastT)}" y1="${y(tr.at(tr.lastT))}" x2="${fx}" y2="${fy}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5" opacity=".55"/>`
     +`<circle cx="${fx}" cy="${fy}" r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2" stroke-dasharray="2 2"/>`
     +`<text x="${fx-8}" y="${fy+16}" text-anchor="end" font-size="10" font-weight="700" fill="var(--text)">${fmtKg(tr.at(tf))} kg expected</text>`;}
  const tt=parse(todayIso).getTime();
  s+=`<line x1="${x(tt)}" x2="${x(tt)}" y1="${m.t}" y2="${height-m.b}" stroke="var(--muted2)" stroke-width="1"/><text x="${x(tt)+4}" y="${height-m.b-6}" font-size="10" font-weight="600" fill="var(--muted)">today</text>`;
  if(dl)s+=`<line x1="${x(parse(dl).getTime())}" x2="${x(parse(dl).getTime())}" y1="${m.t}" y2="${height-m.b}" stroke="var(--bad)" stroke-width="1" stroke-dasharray="3 3"/><text x="${x(parse(dl).getTime())-4}" y="${m.t+10}" text-anchor="end" font-size="10" font-weight="600" fill="var(--bad)">deadline</text>`;
  const pts=W.map(w=>[x(parse(w.date).getTime()),y(w.kg)]);
  s+='<g clip-path="url(#plotClip)">';
  s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  // highest weight gets its own marker (a star)
  let hiI=0;W.forEach((w,i)=>{if(w.kg>W[hiI].kg)hiI=i;});
  W.forEach((w,i)=>{if(i!==hiI)s+=`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="${W.length>60?2.5:4}" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`;});
  const [hx,hy]=pts[hiI],star=[...Array(10)].map((_,k)=>{const r=k%2?3.4:8,a=Math.PI/5*k-Math.PI/2;return (hx+r*Math.cos(a)).toFixed(1)+','+(hy+r*Math.sin(a)).toFixed(1);}).join(' ');
  s+=`<polygon points="${star}" fill="var(--text)" stroke="var(--surface)" stroke-width="1.2"/><text x="${hx-11}" y="${hy-6}" text-anchor="end" font-size="10" font-weight="700" fill="var(--text)">${fmtKg(W[hiI].kg)} kg</text>`;
  s+='</g></svg>';
  wrap.insertAdjacentHTML('afterbegin',s);
  const svg=wrap.querySelector('svg'),tip=$('tip');
  svg.addEventListener('mousemove',ev=>{const r=svg.getBoundingClientRect(),mx=ev.clientX-r.left;let bi=0,bd=1e9;pts.forEach((p,i)=>{const dd=Math.abs(p[0]-mx);if(dd<bd){bd=dd;bi=i}});
    if(bd>40||pts[bi][0]<m.l){tip.style.display='none';return;}tip.style.display='block';tip.style.left=pts[bi][0]+'px';tip.style.top=pts[bi][1]+'px';tip.textContent=fmtD(W[bi].date)+' · '+fmtKg(W[bi].kg)+' kg';});
  svg.addEventListener('mouseleave',()=>tip.style.display='none');
}

function renderActions(){
  if(MODS[mod].rating){let h='';for(let m=0;m<12;m++){const a=iso(new Date(year,m,1)),b=iso(new Date(year,m+1,0));
      h+=smTile(a>todayIso?null:modScore(mod,a,b),new Date(year,m,1).toLocaleDateString(LOC,{month:'short'}));}
    $('actions').innerHTML=`<div class="smgrid">${h}</div>`;return;}
  if(mod!=='training'){let h='';for(let m=0;m<12;m++){const a=iso(new Date(year,m,1)),b=iso(new Date(year,m+1,0));
      h+=ringTile(a>todayIso?null:modScore(mod,a,b),new Date(year,m,1).toLocaleDateString(LOC,{month:'short'}),a<=todayIso&&b>=todayIso);}
    $('actions').innerHTML=`<div class="smgrid">${h}</div>`;return;}
  const T=trained(),pw=perWeek();
  const jan1=new Date(year,0,1),dec31=new Date(year,11,31);
  let cnt=0,months='';
  for(let mo=0;mo<12;mo++){
    const f=new Date(year,mo,1),n=new Date(year,mo+1,0).getDate(),lead=(f.getDay()+6)%7;let c=0,g='';
    for(let i=0;i<lead;i++)g+='<i></i>';
    for(let d=1;d<=n;d++){const k=iso(new Date(year,mo,d)),on=T.has(k);if(on){c++;cnt++;}
      g+=`<button class="yd${on?' on':''}${k===todayIso?' today':''}${k>todayIso?' fut':''}" data-wd="${k}" title="${fmtD(k)}" aria-pressed="${on}">${on?crossSVG(k,k===todayIso):''}</button>`;}
    months+=`<div class="ym"><div class="ymh"><b>${f.toLocaleDateString(LOC,{month:'short'})}</b>${c?`<span>${c}</span>`:''}</div><div class="ymg">${g}</div></div>`;
  }
  // weeks on plan: finished weeks of this year since the first training day, plus this week once it already hits the plan
  const first=[...T].filter(k=>k.startsWith(year+'-')).sort()[0];
  let wTot=0,wHit=0,wStreak=0,run=0;
  if(first){
    const thisMon=iso(mondayOf(new Date()));
    for(let m=mondayOf(parse(first));iso(m)<=thisMon&&m<=dec31;m.setDate(m.getDate()+7)){
      let n=0;for(let i=0;i<7;i++){const d=new Date(m);d.setDate(d.getDate()+i);if(T.has(iso(d)))n++;}
      const current=iso(m)===thisMon,hit=pw&&n>=pw;
      if(current&&!hit)continue;
      wTot++;if(hit){wHit++;run++;}else run=0;
    }
    wStreak=run;
  }
  // ---- year goal: plan (days/week) x weeks from Jan 1 (or the goal start, if later) to Dec 31
  const yStart=[iso(jan1),goalStart()].sort()[1]>iso(dec31)?null:[iso(jan1),goalStart()].sort()[1];
  const span=k=>(parse(k)-parse(yStart))/864e5+1; // days since yStart, inclusive
  const yGoal=pw&&yStart?Math.round(pw*span(iso(dec31))/7):0;
  const expected=pw&&yStart&&todayIso>=yStart?Math.min(yGoal,Math.round(pw*span(todayIso<=iso(dec31)?todayIso:iso(dec31))/7)):0;
  const gp=yGoal?Math.min(100,Math.round(cnt/yGoal*100)):0, ep=yGoal?Math.min(100,Math.round(expected/yGoal*100)):0;
  const pace=cnt-expected;
  const paceTxt=expected?(pace===0?'on pace':Math.abs(pace)+' '+(Math.abs(pace)===1?'day':'days')+' '+(pace>0?'ahead':'behind')):'';
  renderSum();
  $('actions').innerHTML=`<div class="ygrid">${months}</div>`+countTxt(cnt,'in '+year);
}

// Top summary of the Action block: done / goal for the period shown (week, month or year).
// The goal is the plan (days per week) spread over the days of that period, counted from the goal start.
function renderSum(){
  const T=trained(),pw=perWeek();let a,b,label;
  if(actView==='week'){const e=new Date(weekStart);e.setDate(e.getDate()+6);a=iso(weekStart);b=iso(e);label=iso(mondayOf(new Date()))===a?'this week':'in week '+isoWeek(weekStart);}
  else if(actView==='month'){const f=monthStart,l=new Date(f.getFullYear(),f.getMonth()+1,0);a=iso(f);b=iso(l);label='in '+f.toLocaleDateString(LOC,{month:'long'});}
  else{a=year+'-01-01';b=year+'-12-31';label='in '+year;}
  const from=[a,actStart()].sort()[1];
  const days=(x,y)=>x>y?0:(parse(y)-parse(x))/864e5+1;
  // count only days from the goal start on (week view: the whole week), so earlier training doesn't inflate the pace
  const cnt=[...T].filter(k=>k>=(actView==='week'?a:from)&&k<=b).length;
  const goal=pw?(actView==='week'?(b>=actStart()?pw:0):Math.round(pw*days(from,b)/7)):0;
  // pace: training counts the whole week; Food/Sleep only from the first tick (a module started mid-week isn't 'behind')
  const exp=pw&&todayIso>=from?Math.min(goal,Math.round(pw*days(actView==='week'&&mod==='training'?a:from,todayIso<b?todayIso:b)/7)):0;
  const pace=cnt-exp,gp=goal?Math.min(100,Math.round(cnt/goal*100)):0;
  const fresh=mod!=='training'&&!cnt&&actStart()===todayIso; // nothing ticked yet: no 'behind' on day one
  const paceTxt=fresh?'':goal&&todayIso>=from&&todayIso<=b?(pace>=0&&cnt>=goal?'goal reached':pace===0?'on pace':Math.abs(pace)+' '+(Math.abs(pace)===1?'day':'days')+' '+(pace>0?'ahead':'behind')):'';
  if(mod!=='training'){ // Food/Sleep: score vs target (partial days and bonus count)
    const sc=modScore(mod,a,b),tg=targetOf(mod),nd=sc==null?0:days(a,b<todayIso?b:todayIso),
      left=sc==null?'<span class="muted">Tick your first actions</span>':`<span><b>${sc}</b> / 100 score ${label}</span>`;
    const pk=actView==='week'?addD(a,-7):actView==='month'?iso(new Date(parse(a).getFullYear(),parse(a).getMonth()-1,1)):(+a.slice(0,4)-1)+'-01-01';
    const pb=actView==='week'?addD(pk,6):actView==='month'?iso(new Date(parse(pk).getFullYear(),parse(pk).getMonth()+1,0)):(+a.slice(0,4)-1)+'-12-31';
    const prv=modScore(mod,pk,pb),pl={week:'last week',month:'last month',year:'last year'}[actView];
    const dl=sc!=null&&prv!=null?`<span class="dl ${sc-prv>=0?'up':'dn'}" title="vs ${pl}">${sc-prv>=0?'+':''}${sc-prv}</span> · `:'';
    const r=sc==null?'':`<span class="psc${sc>=tg?' ok':''}">${sc>=tg?'on target':'target '+tg}</span>`;
    $('actSum').innerHTML=`<div class="calsum">${left}${r}</div><div class="track thin tgt"><i style="width:${sc==null?0:Math.min(100,sc)}%;background:var(--accent)"></i><b class="tgm" style="left:${tg}%" title="Target ${tg}"></b></div>`;
    $('histSum').textContent=sc==null?'':`${label.replace(/^in /,'')} · ${sc} / 100`;return;}
  $('histSum').textContent=`${label.replace(/^in /,'')} · ${cnt}${goal?' / '+goal:''}`;
  $('actSum').innerHTML=`<div class="calsum"><span><b>${cnt}</b>${goal?' / '+goal:''} days ${label}</span>${paceTxt?`<span>${paceTxt}</span>`:''}</div>
    ${goal?`<div class="track thin"><i style="width:${gp}%;background:var(--accent)"></i></div>`:''}`;
}

document.addEventListener('click',e=>{
  const it=e.target.closest('[data-item]');
  if(it){const d=it.dataset.day;toggleItem(d,it.dataset.item);const dc=$('dayChecks');if(dc)dc.innerHTML=checksHTML(d);return;}
  const tg=e.target.closest('[data-tog]');
  if(tg){UI[tg.dataset.tog]=!UI[tg.dataset.tog];saveUI();if(tg.dataset.tog==='hist'){UI.hist=!UI.hist;setStack(!($('stack').getAttribute('aria-expanded')==='true'&&$('actionCard').classList.contains('open')));return;}if(tg.dataset.tog==='friends'){renderFriends();return;}if(tg.dataset.tog==='trend'||tg.dataset.tog==='details')renderOverview();else{renderToday();const dc=$('dayChecks');if(dc)dc.innerHTML=checksHTML(dc.dataset.day||todayIso);}return;}
  const rb=e.target.closest('[data-rate]');
  if(rb){const d=rb.dataset.day;setRating(d,+rb.dataset.rate);const dc=$('dayChecks');if(dc)dc.innerHTML=checksHTML(d);return;}
  const wb=e.target.closest('[data-water]');
  if(wb){const d=wb.dataset.day;setWater(d,+wb.dataset.water);const dc=$('dayChecks');if(dc)dc.innerHTML=checksHTML(d);return;}
  const tb=e.target.closest('#tabbar [data-mod],.ov-row[data-mod]'); // not body[data-mod]
  if(tb){setMod(tb.dataset.mod);return;}
  const wc=e.target.closest('[data-wd]');
  if(wc){toggle(wc.dataset.wd);return;}
  const c=e.target.closest('rect.c');
  if(c){toggle(c.dataset.d);return;}
  const del=e.target.closest('[data-del]');
  if(del){const [d,t='']=del.dataset.del.split('|'),same=x=>x.date===d&&(x.time||'')===t,w=S.weight.find(same);
    dialog(`<h3>Delete measurement?</h3><p>${fmtD(d)}${t?' · '+t:''} · ${w?fmtKg(w.kg)+' kg':''}</p>`,()=>{S.weight=S.weight.filter(x=>!same(x));save({type:'weight',date:d,time:t,delete:true});},'Delete');return;}
  const go=e.target.closest('[data-go]');
  if(go){const g=go.dataset.go;if(g==='week')$('actionCard').scrollIntoView({behavior:'smooth',block:'center'});else openEdit(g);return;}
  const ed=e.target.closest('[data-edit]');
  if(ed)openEdit(ed.dataset.edit);
});
